<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arduino Components — Logo 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="responsive.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --teal:#307fff;--teal-dark:#0123ac;--teal-light:rgba(0, 47, 157, 0.12);
  --orange:#e8500a;--dark:#0a0c0d;--dark2:#111416;--dark3:#181c1e;
  --border:rgba(255,255,255,0.08);--muted:rgba(255,255,255,0.55);--faint:rgba(255,255,255,0.06);
}
html{scroll-behavior:smooth;}
body{font-family:'DM Sans',sans-serif;background:var(--dark);color:#fff;height:100vh;overflow:hidden;position:relative;}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:200;height:64px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 40px;background:rgba(10,12,13,0.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);gap:24px;}
.nav-logo{font-family:'Fraunces',serif;font-size:24px;font-weight:900;font-style:italic;color:var(--teal);letter-spacing:-1px;text-decoration:none;text-shadow:0 0 28px rgba(0,151,157,0.4);}
.nav-links{display:flex;gap:4px;list-style:none;}
.nav-links a{font-size:13px;font-weight:500;color:var(--muted);text-decoration:none;padding:6px 13px;border-radius:8px;transition:all .2s;white-space:nowrap;}
.nav-links a:hover,.nav-links a.active{background:var(--teal-light);color:var(--teal);}
.nav-right{display:flex;align-items:center;justify-content:flex-end;gap:10px;}
.nav-search{display:flex;align-items:center;background:var(--faint);border:1.5px solid var(--border);border-radius:100px;padding:0 14px;height:34px;gap:8px;transition:border-color .2s;width:200px;}
.nav-search:focus-within{border-color:var(--teal);background:rgba(0,151,157,0.06);}
.nav-search svg{width:13px;color:var(--muted);flex-shrink:0;}
.nav-search input{background:none;border:none;outline:none;font-family:'DM Sans',sans-serif;font-size:12.5px;color:#fff;width:100%;}
.nav-search input::placeholder{color:rgba(255,255,255,0.25);}
.nav-account{display:flex;align-items:center;gap:8px;background:var(--teal);color:#fff;border:none;padding:7px 16px 7px 9px;border-radius:100px;font-size:13px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .2s;}
.nav-account:hover{background:var(--teal-dark);}
.acc-av{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-size:12px;}
.nav-logo .orange{ color: var(--orange);}
.back-btn{position:fixed;top:78px;left:36px;z-index:210;display:flex;align-items:center;gap:7px;background:rgba(10,12,13,0.88);border:1px solid var(--border);color:rgba(255,255,255,0.7);padding:7px 15px 7px 11px;border-radius:100px;font-size:12.5px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;text-decoration:none;backdrop-filter:blur(10px);transition:all .22s;}
.back-btn:hover{background:var(--teal-light);border-color:var(--teal);color:#fff;transform:translateX(-2px);}
.back-btn svg{width:13px;}

.account-wrap{position:relative;}
.nav-account{display:flex;align-items:center;gap:8px;background:var(--teal);color:#fff;border:none;padding:7px 16px 7px 9px;border-radius:100px;font-size:13px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .2s;}
.nav-account:hover{background:var(--teal-dark);}
.acc-av{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-size:12px;}
.account-dropdown{position:absolute;top:calc(100% + 10px);right:0;width:280px;background:#181c1e;border:1px solid var(--border);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,0.6);overflow:hidden;opacity:0;pointer-events:none;transform:translateY(-8px);transition:opacity .22s,transform .22s;z-index:300;}
.account-dropdown.open{opacity:1;pointer-events:all;transform:translateY(0);}
.acc-header{background:linear-gradient(135deg,#307fff,#0123ac);padding:20px 18px;display:flex;align-items:center;gap:14px;}
.acc-big-avatar{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,0.22);display:flex;align-items:center;justify-content:center;font-size:22px;border:2px solid rgba(255,255,255,0.3);flex-shrink:0;}
.acc-name{font-size:14px;font-weight:700;color:#fff;}
.acc-email{font-size:11px;color:rgba(255,255,255,0.6);margin-top:2px;}
.acc-progress-wrap{padding:14px 16px;border-bottom:1px solid var(--border);}
.acc-progress-label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:7px;}
.acc-progress-bar{height:5px;background:rgba(255,255,255,0.08);border-radius:100px;overflow:hidden;}
.acc-progress-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--teal-dark));border-radius:100px;}
.acc-menu{padding:6px;}
.acc-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer;text-decoration:none;color:rgba(255,255,255,0.8);font-size:13px;font-weight:500;transition:background .15s;}
.acc-item:hover{background:rgba(0,151,157,0.1);color:var(--teal);}
.acc-item-icon{width:30px;height:30px;border-radius:8px;background:var(--faint);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.acc-divider{height:1px;background:var(--border);margin:4px 12px;}
.acc-logout{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:500;color:#f28b82;transition:background .15s;border:none;background:none;width:100%;font-family:'DM Sans',sans-serif;margin-bottom:4px;}
.acc-logout:hover{background:rgba(242,139,130,0.08);}
.back-btn{position:fixed;top:78px;left:36px;z-index:210;display:flex;align-items:center;gap:7px;background:rgba(5,7,8,0.88);border:1px solid var(--border);color:rgba(255,255,255,0.7);padding:7px 15px 7px 11px;border-radius:100px;font-size:12.5px;font-weight:600;cursor:pointer;text-decoration:none;backdrop-filter:blur(10px);transition:all .22s;}
.back-btn:hover{background:var(--teal-light);border-color:var(--teal);color:#fff;transform:translateX(-2px);}
.back-btn svg{width:13px;}

/* APP LAYOUT */
#app{position:fixed;inset:64px 0 0 0;display:flex;flex-direction:column;overflow:hidden;}

/* HERO PANEL */
#heroPanel{position:relative;flex:1;display:flex;min-height:0;transition:flex .55s cubic-bezier(.4,0,.2,1);overflow:hidden;}
#app.detail-open #heroPanel{flex:0 0 0px;opacity:0;pointer-events:none;}

#bgLayer{position:absolute;inset:0;transition:background-color .7s ease;background-color:#0d1214;}
#bgLayer::before{content:'';position:absolute;inset:0;background:linear-gradient(to right,rgba(0,0,0,0.9) 0%,rgba(0,0,0,0.55) 38%,rgba(0,0,0,0.18) 65%,rgba(0,0,0,0.35) 100%);z-index:1;}
#bgLayer::after{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(0,151,157,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,151,157,0.03) 1px,transparent 1px);background-size:50px 50px;z-index:0;}
#heroCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;}

.bg-emoji{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:320px;opacity:0.04;z-index:0;user-select:none;pointer-events:none;filter:blur(2px);transition:all .6s ease;}

/* LEFT PANEL */
.left-panel{position:absolute;left:0;top:0;bottom:0;width:42%;z-index:10;display:flex;flex-direction:column;justify-content:flex-end;padding:0 52px 80px 52px;}
.comp-category{font-size:11px;font-weight:600;color:var(--teal);text-transform:uppercase;letter-spacing:3px;margin-bottom:10px;display:flex;align-items:center;gap:10px;}
.comp-category::before{content:'';display:block;width:26px;height:2px;background:var(--teal);border-radius:2px;}
.comp-name{font-family:'Fraunces',serif;font-size:clamp(40px,6vw,75px);font-weight:900;line-height:.92;letter-spacing:-2px;color:#fff;text-transform:uppercase;text-shadow:0 4px 40px rgba(0,0,0,0.5);margin-bottom:16px;}
.comp-desc{font-size:13px;color:var(--muted);line-height:1.75;max-width:320px;margin-bottom:22px;}
.comp-tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:28px;}
.comp-tag{font-family:'DM Mono',monospace;font-size:10px;font-weight:500;color:var(--muted);border:1px solid rgba(255,255,255,0.18);padding:3px 11px;border-radius:100px;}
.comp-tag.teal{border-color:var(--teal);color:var(--teal);background:rgba(0,151,157,0.1);}
.comp-actions{display:flex;align-items:center;gap:20px;}
.diff-wrap{display:flex;flex-direction:column;gap:5px;}
.diff-label{font-size:9px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
.diff-dots{display:flex;gap:5px;}
.diff-dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,0.15);}
.diff-dot.on{background:var(--teal);box-shadow:0 0 7px rgba(0,151,157,0.6);}
.btn-learn{background:var(--teal);color:#fff;border:none;padding:12px 28px;border-radius:100px;font-size:13.5px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .22s;box-shadow:0 6px 22px rgba(0,151,157,0.38);}
.btn-learn:hover{background:var(--teal-dark);transform:translateY(-2px);}

/* counter */
.comp-counter-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.comp-num{font-family:'Fraunces',serif;font-size:64px;font-weight:900;color:rgba(255,255,255,0.07);line-height:1;letter-spacing:-2px;position:absolute;right:52px;bottom:80px;z-index:10;}
.progress-bar{width:100%;height:2px;background:rgba(255,255,255,0.08);border-radius:2px;margin-top:8px;}
.progress-fill{height:100%;background:var(--teal);border-radius:2px;transition:width .4s;}

/* PANEL SWAP */
@keyframes panelSwap{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.panel-swap{animation:panelSwap .35s ease forwards;}

/* RIGHT CARDS */
.right-panel{position:absolute;right:0;top:0;bottom:0;width:46%;z-index:10;display:flex;align-items:center;padding:20px 0 80px 20px;overflow:hidden;}
.cards-track{display:flex;gap:14px;height:100%;align-items:center;will-change:transform;transition:transform .5s cubic-bezier(.34,1.1,.64,1);}
.comp-card{flex-shrink:0;width:190px;height:290px;border-radius:20px;background:var(--dark3);border:1px solid var(--border);overflow:hidden;cursor:pointer;transition:all .35s cubic-bezier(.34,1.2,.64,1);position:relative;display:flex;flex-direction:column;justify-content:flex-end;transform-style:preserve-3d;}
.comp-card:hover{transform:translateY(-8px) scale(1.02);border-color:rgba(255,255,255,0.2);box-shadow:0 16px 48px rgba(0,0,0,0.5);}
.comp-card.active{width:230px;height:360px;border-color:var(--teal);box-shadow:0 0 0 2px var(--teal),0 20px 56px rgba(0,151,157,0.3);transform:translateY(-14px);}
.comp-card.active:hover{transform:translateY(-18px) scale(1.02);}

.card-visual{position:absolute;top:50%;left:50%;transform:translate(-50%,-60%);width:80px;height:80px;pointer-events:none;transition:all .35s;display:flex;align-items:center;justify-content:center;}
.card-visual .card-emoji{font-size:72px;line-height:1;opacity:0.6;filter:drop-shadow(0 8px 20px rgba(0,0,0,0.4));transition:all .35s;}
.card-visual img{width:200%;object-fit:contain;opacity:0.75;filter:drop-shadow(0 8px 20px rgba(0,0,0,0.5)) brightness(0.95);transition:all .35s;}
.comp-card.active .card-visual{width:100px;height:100px;}
.comp-card.active .card-visual .card-emoji{font-size:90px;opacity:0.75;}
.comp-card:hover .card-visual .card-emoji{transform:scale(1.1) rotate(-5deg);}

.card-badge{position:absolute;top:12px;right:12px;background:var(--teal);color:#fff;font-family:'DM Mono',monospace;font-size:9px;font-weight:700;padding:3px 10px;border-radius:100px;text-transform:uppercase;letter-spacing:.5px;}
.card-badge.hot{background:var(--orange);}

.card-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,0.85) 0%,rgba(0,0,0,0.3) 50%,transparent 100%);z-index:1;}
.card-info{position:relative;z-index:2;padding:14px;}
.card-category{font-size:9px;font-weight:600;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:4px;}
.card-name{font-family:'Fraunces',serif;font-size:17px;font-weight:900;color:#fff;line-height:1.1;margin-bottom:8px;}
.card-dots{display:flex;gap:4px;}
.card-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,0.12);}
.card-dot.on{background:var(--teal);box-shadow:0 0 6px rgba(0,151,157,0.5);}

/* NAV ARROWS */
.nav-arrows{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);z-index:10;display:flex;align-items:center;gap:10px;}
.nav-arrow{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.06);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;color:var(--muted);}
.nav-arrow:hover{background:var(--teal-light);border-color:var(--teal);color:#fff;}
.nav-arrow svg{width:16px;}
.nav-hint{font-size:11px;color:rgba(255,255,255,0.2);letter-spacing:1px;}

/* FILTER PILLS */
.filter-bar{position:absolute;top:50px;left:52px;right:52px;z-index:10;display:flex;gap:8px;flex-wrap:wrap;}
.filter-pill{font-size:11px;font-weight:600;font-family:'DM Mono',monospace;color:var(--muted);background:rgba(255,255,255,0.04);border:1px solid var(--border);padding:5px 14px;border-radius:100px;cursor:pointer;transition:all .18s;white-space:nowrap;}
.filter-pill:hover{border-color:var(--teal);color:var(--teal);}
.filter-pill.active{background:var(--teal);border-color:var(--teal);color:#fff;box-shadow:0 3px 14px rgba(0,151,157,0.3);}

/* DETAIL PANEL */
#detailPanel{flex:1;background:var(--dark2);overflow-y:auto;display:flex;flex-direction:column;scrollbar-width:thin;scrollbar-color:var(--teal) transparent;}
.detail-topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 48px;border-bottom:1px solid var(--border);background:var(--dark3);position:sticky;top:0;z-index:20;flex-shrink:0;}
.detail-crumb{font-family:'DM Mono',monospace;font-size:12px;color:var(--muted); padding-left: 200px;}
.btn-close-detail{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--muted);padding:7px 16px;border-radius:100px;font-size:12.5px;font-weight:600;cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif;}
.btn-close-detail:hover{background:rgba(232,80,10,0.1);border-color:rgba(232,80,10,0.3);color:#ff8a65;}
.btn-close-detail svg{width:13px;}

.detail-content-wrap{flex:1;padding:40px 48px 60px;display:grid;grid-template-columns:1fr 1fr;gap:36px;max-width:1200px;margin:0 auto;width:100%;}
.detail-visual{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:28px;padding:32px 0 20px;border-bottom:1px solid var(--border);position:relative;}
.detail-visual-badge{background:var(--teal-light);border:1px solid rgba(0,151,157,0.3);color:var(--teal);font-size:11px;font-weight:700;padding:5px 14px;border-radius:100px;letter-spacing:1px;text-transform:uppercase;}
.detail-section-title{font-size:15px;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:2.5px;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.detail-section-title::before{content:'';width:18px;height:2px;background:var(--teal);border-radius:2px;flex-shrink:0;}
.detail-component-name{font-family:'Fraunces',serif;font-size:clamp(28px,3vw,40px);font-weight:900;letter-spacing:-1.5px;margin-bottom:8px;}
.detail-category-tag{display:inline-block;font-family:'DM Mono',monospace;font-size:15px;font-weight:700;color:var(--teal);background:var(--teal-light);border:1px solid rgba(0,151,157,0.25);padding:3px 12px;border-radius:100px;margin-bottom:16px;}
.detail-desc-full{font-size:15.5px;color:var(--muted);line-height:1.8;margin-bottom:20px;}
.detail-uses-title{font-size:25px;font-weight:700;color:#fff;margin-bottom:10px;}
.use-row{display:flex;align-items:flex-start;gap:10px;font-size:13px;color:var(--muted);margin-bottom:8px;line-height:1.5;}
.use-dot{width:6px;height:6px;border-radius:50%;background:var(--teal);flex-shrink:0;margin-top:6px;}

/* Pinout table */
.pinout-table{width:100%;border-collapse:collapse;margin-top:12px;font-size:15px;}
.pinout-table th{text-align:left;font-size:10.5px;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:1.5px;padding:8px 12px;background:rgba(0,151,157,0.08);border-bottom:1px solid var(--border);}
.pinout-table td{padding:9px 12px;border-bottom:1px solid rgba(255,255,255,0.04);color:var(--muted);}
.pinout-table tr:last-child td{border-bottom:none;}
.pinout-table td:first-child{font-family:'DM Mono',monospace;font-weight:600;color:#fff;font-size:15px;}
.pin-badge{font-family:'DM Mono',monospace;font-size:10px;font-weight:700;padding:2px 9px;border-radius:6px;white-space:nowrap;}
.pin-badge.teal{background:var(--teal-light);color:var(--teal);}
.pin-badge.orange{background:rgba(232,80,10,0.15);color:#ff8a65;}
.pin-badge{background:var(--faint);color:var(--muted);}

/* Code block */
.code-block{background:#0d1117;border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-top:0;transition:box-shadow .2s;}
.code-block:hover{box-shadow:0 0 0 1px rgba(0,151,157,0.25);}
.code-header{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;background:rgba(255,255,255,0.03);border-bottom:1px solid var(--border);}
.code-lang{font-family:'DM Mono',monospace;font-size:15.5px;font-weight:600;color:var(--teal);text-transform:uppercase;letter-spacing:1px;}
.copy-btn{background:none;border:1px solid var(--border);color:var(--muted);padding:2px 9px;border-radius:5px;font-size:15.5px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .18s;}
.copy-btn:hover{background:var(--teal-light);border-color:var(--teal);color:var(--teal);}
pre.code-pre{padding:16px;overflow-x:auto;font-family:'DM Mono',monospace;font-size:13px;line-height:1.8;color:#c9d1d9;margin:0;scrollbar-width:thin;}
.kw{color:#ff7b72;}.fn{color:#d2a8ff;}.cm{color:#8b949e;}.st{color:#a5d6ff;}.nm{color:#79c0ff;}

/* Tip box */
.tip-box{background:rgba(0,151,157,0.07);border:1px solid rgba(0,151,157,0.2);border-radius:12px;padding:14px 18px;display:flex;gap:12px;align-items:flex-start;margin-top:16px;}
.tip-icon{font-size:20px;flex-shrink:0;}
.tip-text{font-size:15.5px;color:var(--muted);line-height:1.7;}
.tip-text strong{color:#fff;}

/* Circuit section */
.circuit-section{grid-column:1/-1;border-top:1px solid var(--border);padding-top:28px;}
.circuit-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px;}
.circuit-img-wrap{background:rgba(0,0,0,0.3);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:all .25s;}
.circuit-img-wrap:hover{border-color:rgba(0,151,157,0.25);}
.circuit-img-wrap img{width:100%;display:block;object-fit:cover;}
.circuit-caption{font-size:15px;color:var(--muted);text-align:center;padding:8px 12px;background:rgba(0,0,0,0.3);font-family:'DM Mono',monospace;}
.circuit-placeholder{background:rgba(0,151,157,0.04);border:1.5px dashed rgba(0,151,157,0.2);border-radius:12px;padding:24px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;}
.circuit-placeholder-icon{font-size:28px;}
.circuit-placeholder-text{font-size:12px;color:var(--muted);line-height:1.6;}
.circuit-placeholder-text code{display:block;font-family:'DM Mono',monospace;font-size:10px;color:rgba(0,151,157,0.7);margin-top:6px;word-break:break-all;}

/* Bottom nav */
.detail-bottom-nav{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;padding-top:28px;border-top:1px solid var(--border);}
.btn-detail-prev,.btn-detail-next{display:flex;align-items:center;gap:8px;padding:12px 24px;border-radius:100px;font-size:13px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .22s;border:1.5px solid var(--border);background:var(--faint);color:var(--muted);}
.btn-detail-prev:hover,.btn-detail-next:hover{border-color:var(--teal);color:var(--teal);background:var(--teal-light);}
.btn-detail-next{background:var(--teal);border-color:var(--teal);color:#fff;}

const components = [
  {emoji:'🟦',image:'images/ArduinoUno.png',name:'Arduino Uno',category:'Board · Main Controller',desc:'The brain of many Arduino projects. Reads inputs and controls outputs.',tags:['ATmega328P','USB Powered','Digital + Analog'],tagTeal:'Essential',level:1,badge:'Starter',badgeClass:'',color:'#00212a',descFull:'Arduino Uno is a beginner-friendly microcontroller board based on the ATmega328P. It has digital pins, analog inputs, PWM outputs, USB programming, and power options.',uses:['Robotics','Sensors','Automation','Learning electronics'],pinout:[{pin:'5V',arduino:'Power Out',notes:'Supply modules',type:'orange'},{pin:'GND',arduino:'Ground',notes:'Common ground',type:''},{pin:'D0-D13',arduino:'Digital Pins',notes:'Input / Output',type:'teal'},{pin:'A0-A5',arduino:'Analog Pins',notes:'Sensor reading',type:'teal'}],code:`<span class="cm">// Arduino Uno — the main board</span>\n<span class="kw">void</span> <span class="fn">setup</span>() {\n  <span class="cm">// runs once at power-on</span>\n}\n<span class="kw">void</span> <span class="fn">loop</span>() {\n  <span class="cm">// runs forever</span>\n}`,tip:'Always use common ground when connecting external modules to your Arduino.',circuits:[{src:'images/arduino-uno-top.png',caption:'Arduino Uno Front View',height:'300px',objectFit:'contain'},{src:'images/arduino-uno-pins.png',caption:'Pin Layout Diagram',height:'300px',objectFit:'contain',cols:2}]},
  {emoji:'🟦',image:'images/nano.webp',name:'Arduino Nano',category:'Board · Compact Controller',desc:'Compact breadboard-friendly Arduino. Same ATmega328P power as the Uno in a tiny package.',tags:['ATmega328P','Breadboard-ready','Mini USB'],tagTeal:'Essential',level:1,badge:'Compact',badgeClass:'',color:'#00121a',descFull:'The Arduino Nano packs the same ATmega328P microcontroller as the Uno into an 18×43mm form factor that plugs directly into a breadboard. It has 14 digital I/O pins (6 PWM), 8 analog inputs, and a Mini-USB port for programming. Perfect when space is tight or the project lives on a breadboard.',uses:['Wearables and compact gadgets','Breadboard-integrated projects','Portable sensor data loggers','Robot controllers with limited space'],pinout:[{pin:'D0–D13',arduino:'Digital I/O',notes:'D3,5,6,9,10,11 = PWM',type:'teal'},{pin:'A0–A7',arduino:'Analog Inputs',notes:'A6/A7 are analog-input only',type:'teal'},{pin:'5V',arduino:'Power Out',notes:'Regulated 5V supply',type:'orange'},{pin:'3V3',arduino:'Power Out',notes:'100mA max',type:'orange'},{pin:'GND',arduino:'Ground',notes:'Common ground',type:''},{pin:'VIN',arduino:'Power In',notes:'7–12V external supply',type:'orange'}],code:`<span class="cm">// Arduino Nano — same code as the Uno</span>\n<span class="kw">const</span> <span class="st">int</span> ledPin = <span class="nm">13</span>;\n<span class="kw">void</span> <span class="fn">setup</span>() {\n  <span class="fn">pinMode</span>(ledPin, OUTPUT);\n  Serial.<span class="fn">begin</span>(<span class="nm">9600</span>);\n}\n<span class="kw">void</span> <span class="fn">loop</span>() {\n  <span class="fn">digitalWrite</span>(ledPin, HIGH); <span class="fn">delay</span>(<span class="nm">500</span>);\n  <span class="fn">digitalWrite</span>(ledPin, LOW);  <span class="fn">delay</span>(<span class="nm">500</span>);\n  Serial.<span class="fn">println</span>(<span class="st">"Blink!"</span>);\n}`,tip:'Clone Nano boards often use the CH340 USB chip instead of FTDI. If your PC does not detect the board, install the CH340 driver from the manufacturer\'s website.',circuits:[{src:'images/nano-pinout.png',caption:'Arduino Nano Pinout',cols:2,objectFit:'contain',height:'500px'}]},
  {emoji:'🟩',image:'images/mega.webp',name:'Arduino Mega',category:'Board · Advanced Controller',desc:'54 digital pins, 16 analog inputs, and 4 hardware serial ports. The powerhouse for big projects.',tags:['ATmega2560','54 Digital I/O','4× Serial'],tagTeal:'Essential',level:2,badge:'Pro',badgeClass:'',color:'#001a08',descFull:'The Arduino Mega 2560 is built around the ATmega2560 with 54 digital I/O pins (15 PWM), 16 analog inputs, 256KB of flash memory, and four independent hardware Serial ports (Serial, Serial1, Serial2, Serial3). It is the go-to board when the Uno simply runs out of pins or program memory.',uses:['3D printer control boards (RAMPS shield)','Large LED matrix or NeoPixel installations','Multi-sensor data-logging systems','CNC machines and robotics with many servos'],pinout:[{pin:'D0–D53',arduino:'Digital I/O',notes:'D2–D13, D44–D46 = PWM',type:'teal'},{pin:'A0–A15',arduino:'Analog Inputs',notes:'16 analog channels',type:'teal'},{pin:'5V / 3.3V',arduino:'Power Out',notes:'On-board regulated supplies',type:'orange'},{pin:'VIN',arduino:'Power In',notes:'7–12V recommended',type:'orange'},{pin:'Serial1 TX1/RX1',arduino:'Pins 18 / 19',notes:'Hardware serial port 1',type:'teal'},{pin:'SDA / SCL',arduino:'Pins 20 / 21',notes:'I2C bus',type:'teal'}],code:`<span class="cm">// Arduino Mega — multiple hardware serial ports</span>\n<span class="kw">void</span> <span class="fn">setup</span>() {\n  Serial.<span class="fn">begin</span>(<span class="nm">9600</span>);  <span class="cm">// USB to PC</span>\n  Serial1.<span class="fn">begin</span>(<span class="nm">9600</span>); <span class="cm">// Pins 18/19 — e.g. GPS</span>\n  Serial2.<span class="fn">begin</span>(<span class="nm">9600</span>); <span class="cm">// Pins 16/17 — e.g. BT</span>\n}\n<span class="kw">void</span> <span class="fn">loop</span>() {\n  <span class="kw">if</span> (Serial1.<span class="fn">available</span>()) {\n    Serial.<span class="fn">write</span>(Serial1.<span class="fn">read</span>()); <span class="cm">// forward GPS to PC</span>\n  }\n}`,tip:'The Mega\'s SDA/SCL pins are at 20/21 — NOT A4/A5 like on the Uno. Remember to rewire I2C devices when upgrading from a Uno to a Mega.',circuits:[{src:'images/mega-pinout.webp',caption:'Arduino Mega 2560 Pinout',cols:2,objectFit:'contain',height:'900px'}]},
  {emoji:'🔌',image:'images/breadboard.png',name:'Breadboard',category:'Power · Prototyping',desc:'Solderless board for quick circuit building. The backbone of every prototype.',tags:['No soldering','5V / 3.3V rails','Prototyping'],tagTeal:'Essential',level:1,badge:'Must Have',badgeClass:'',color:'#0c0c0c',descFull:'A breadboard is a solderless prototyping board that lets you build and modify circuits instantly. The rows in the middle are connected horizontally (5 holes per row), while the long columns on each side are the power rails (+ and −).',uses:['Prototyping circuits before soldering','Testing component values','Building temporary test rigs','Learning circuit layouts quickly'],pinout:[{pin:'Power Rail (+)',arduino:'5V or 3.3V',notes:'Red column',type:'orange'},{pin:'Ground Rail (−)',arduino:'GND',notes:'Blue/Black column',type:''},{pin:'Middle Rows (a–e)',arduino:'Component leads',notes:'Horizontal connection',type:'teal'},{pin:'Middle Rows (f–j)',arduino:'Component leads',notes:'Horizontal connection',type:'teal'}],code:`<span class="cm">// No code needed — breadboard is a hardware tool!</span>\n<span class="cm">// Tip: RED = 5V, BLUE = GND, other = signal</span>\n<span class="kw">void</span> <span class="fn">setup</span>() { }\n<span class="kw">void</span> <span class="fn">loop</span>() { }`,tip:'Color-code your jumper wires: RED for power, BLACK for ground, any other color for signal lines.',circuits:[{src:'images/BreadBoard1.png',caption:'Breadboard Layout & Rails',height:'300px',objectFit:'contain',cols:2},{src:'images/breadboard (1).png',caption:'Breadboard Wiring Example',height:'300px',objectFit:'contain',cols:2}]},
  {emoji:'🟫',image:'images/resistor.png',name:'Resistors',category:'Component · Basic',desc:'Limits current and divides voltage. Essential in every circuit.',tags:['220Ω','1kΩ','Basic'],tagTeal:'Essential',level:1,badge:'Must Have',badgeClass:'',color:'#1a1208',descFull:'Resistors control current flow in circuits. They obey Ohm\'s Law: V = I × R. For an LED with 5V supply and a 2V forward voltage, a 220Ω resistor limits current to a safe ~13mA. Read the color bands to identify the resistance value.',uses:['LED current protection','Pull-up/pull-down inputs','Voltage divider circuits','I2C line biasing'],pinout:[{pin:'Leg 1',arduino:'Any direction',notes:'No polarity — works both ways',type:'teal'},{pin:'Leg 2',arduino:'Any direction',notes:'No polarity — works both ways',type:'teal'}],code:`<span class="cm">// Hardware component — no code needed</span>\n<span class="cm">// 220Ω for LEDs: (5-2)/220 ≈ 13mA (safe)</span>\n<span class="cm">// 10kΩ pull-up: keeps input pin HIGH</span>\n<span class="kw">void</span> <span class="fn">setup</span>() { }\n<span class="kw">void</span> <span class="fn">loop</span>() { }`,tip:'220Ω is standard for LEDs. 10kΩ is used for pull-up/pull-down resistors on buttons and sensors.',circuits:[{src:'images/led-with-resistors.png',caption:'LED With Resistor',height:'350px',objectFit:'contain',cols:2},{src:'images/resistor-color-code.png',caption:'Color Code Chart',height:'300px',objectFit:'contain',cols:2}]},
  {emoji:'🔵',image:null,name:'Capacitor',category:'Component · Basic',desc:'Stores and releases electrical charge — smooths power and filters noise.',tags:['Electrolytic','Ceramic','µF'],tagTeal:'Essential',level:1,badge:'',badgeClass:'',color:'#0a1a1a',descFull:'A capacitor stores electrical charge and releases it quickly when needed. Ceramic capacitors (small, disc-shaped, no polarity) are used for filtering high-frequency noise, usually placed right next to a chip\'s power pins. Electrolytic capacitors (larger, cylindrical, and polarized — they have a + and − leg) store more charge and are used to smooth out power supply dips, especially near motors.',uses:['Decoupling/filtering noise near sensor and IC power pins','Smoothing voltage dips when a motor or relay switches on','Debouncing a button in hardware instead of code','Timing circuits (with a resistor, sets a charge/discharge rate)'],pinout:[{pin:'Long leg (+)',arduino:'Positive / higher voltage side',notes:'Electrolytic only — has polarity',type:'teal'},{pin:'Short leg (−), striped side',arduino:'GND / lower voltage side',notes:'Electrolytic only — has polarity',type:''},{pin:'Either leg (ceramic)',arduino:'Either direction',notes:'No polarity — works both ways',type:'teal'}],code:`<span class="cm">// Hardware component — no code needed</span>\n<span class="cm">// 100nF ceramic across VCC/GND = noise filter for a chip</span>\n<span class="cm">// 100–1000µF electrolytic across motor power = smooths voltage dips</span>\n<span class="kw">void</span> <span class="fn">setup</span>() { }\n<span class="kw">void</span> <span class="fn">loop</span>() { }`,tip:'Installing an electrolytic capacitor backwards can cause it to heat up, bulge, and in rare cases burst — always match the striped (−) leg to ground. Ceramic capacitors have no polarity, so this only applies to electrolytics.'},
  {emoji:'🔻',image:null,name:'Diode',category:'Component · Basic',desc:'Lets current flow in one direction only — protects circuits from reverse voltage and spikes.',tags:['1N4001/4007','Polarity','Flyback protection'],tagTeal:'Essential',level:1,badge:'',badgeClass:'',color:'#1a0a0a',descFull:'A diode only allows current to flow one way, from the anode to the cathode (marked by a stripe). Beyond simple one-way circuits, its most common job in Arduino projects is as a "flyback diode" — placed backwards across a motor, relay coil, or solenoid to absorb the voltage spike (back-EMF) generated when the coil switches off, protecting the Arduino or transistor driving it.',uses:['Flyback protection across relay coils and DC motors','Reverse-polarity protection on a power input','Simple logic gates (OR/AND) in basic circuits','Voltage drop (~0.7V) for reference or level shifting'],pinout:[{pin:'Anode (+)',arduino:'Current flows in here',notes:'Unmarked end',type:'teal'},{pin:'Cathode (−), striped end',arduino:'Current flows out here',notes:'Marked with a band',type:''}],code:`<span class="cm">// Hardware component — no code needed</span>\n<span class="cm">// Flyback diode: cathode (striped end) toward +V,</span>\n<span class="cm">// anode toward the relay/motor terminal — wired</span>\n<span class="cm">// "backwards" on purpose to only conduct on the spike</span>\n<span class="kw">void</span> <span class="fn">setup</span>() { }\n<span class="kw">void</span> <span class="fn">loop</span>() { }`,tip:'Any relay, DC motor, or solenoid you switch with a transistor or relay module needs a flyback diode across its terminals — without one, the voltage spike when it turns off can damage the Arduino pin or transistor driving it.'},
  {emoji:'🔺',image:null,name:'Transistor',category:'Component · Basic',desc:'Acts as an electronic switch — lets a small Arduino signal control a much larger current.',tags:['NPN','BC547/2N2222','Switching'],tagTeal:'Essential',level:2,badge:'',badgeClass:'',color:'#0a0a1a',descFull:'An Arduino pin can only safely supply about 20–40mA — nowhere near enough for a motor, relay coil, or long LED strip. A transistor (like the common NPN BC547 or 2N2222) solves this: a small current into its Base pin (through a resistor) lets a much larger current flow from Collector to Emitter, using an external power source. In effect, the Arduino "flips a switch" that controls the real power.',uses:['Switching a motor, relay coil, or LED strip that draws more current than a pin can supply','Driving a buzzer or lamp louder/brighter than direct connection allows','Simple signal amplification','Building basic logic gates from discrete parts'],pinout:[{pin:'Base (B)',arduino:'Digital Pin via ~1kΩ resistor',notes:'Small control signal',type:'teal'},{pin:'Collector (C)',arduino:'Load (motor/relay/LED −)',notes:'Larger current flows through here',type:'teal'},{pin:'Emitter (E)',arduino:'GND',notes:'Shared ground',type:''}],code:`<span class="kw">const</span> <span class="st">int</span> basePin = <span class="nm">9</span>; <span class="cm">// through a 1kΩ resistor to the transistor Base</span>\n<span class="kw">void</span> <span class="fn">setup</span>() { <span class="fn">pinMode</span>(basePin, OUTPUT); }\n<span class="kw">void</span> <span class="fn">loop</span>() {\n  <span class="fn">digitalWrite</span>(basePin, HIGH); <span class="fn">delay</span>(<span class="nm">1000</span>); <span class="cm">// switch load ON</span>\n  <span class="fn">digitalWrite</span>(basePin, LOW);  <span class="fn">delay</span>(<span class="nm">1000</span>); <span class="cm">// switch load OFF</span>\n}`,tip:'Always put a resistor (around 1kΩ) between the Arduino pin and the Base — connecting it directly can pull too much current through the pin and damage it. For inductive loads like motors or relay coils, add a flyback diode too.'},
  {emoji:'💡',image:'images/led.png',name:'LED',category:'Output · Basic',desc:'Light Emitting Diode — the very first component every Arduino learner uses.',tags:['digitalWrite()','PWM','Resistor needed'],tagTeal:'Starter',level:1,badge:'Start Here',badgeClass:'',color:'#0e1008',descFull:'An LED converts electrical current into light. The longer leg (anode) connects to a digital pin through a 220Ω resistor, and the shorter leg (cathode) connects to GND. Use digitalWrite() to turn it on/off, or analogWrite() on a PWM pin to dim it.',uses:['Indicator lights for power, status, or alerts','Traffic light simulations','Blinking patterns for visual feedback','RGB lighting when using red, green, blue LEDs separately'],pinout:[{pin:'Anode (+)',arduino:'Digital Pin (e.g. 13)',notes:'Through 220Ω resistor',type:'teal'},{pin:'Cathode (−)',arduino:'GND',notes:'Ground connection',type:''}],code:`<span class="cm">// Blink LED on pin 13</span>\n<span class="kw">const</span> <span class="st">int</span> ledPin = <span class="nm">13</span>;\n<span class="kw">void</span> <span class="fn">setup</span>() { <span class="fn">pinMode</span>(ledPin, OUTPUT); }\n<span class="kw">void</span> <span class="fn">loop</span>() {\n  <span class="fn">digitalWrite</span>(ledPin, HIGH); <span class="fn">delay</span>(<span class="nm">1000</span>);\n  <span class="fn">digitalWrite</span>(ledPin, LOW);  <span class="fn">delay</span>(<span class="nm">1000</span>);\n}`,tip:'Always use a current-limiting resistor (220Ω–470Ω) in series with an LED. Without it, you risk burning out both the LED and the Arduino pin.',circuits:[{src:'images/led-with-resistors.png',caption:'LED With Resistor (No Code)',height:'350px',objectFit:'contain',cols:2},{src:'images/p2s2.png',caption:'LED With Resistor (With Code)',height:'350px',objectFit:'contain',cols:2}]},
  {emoji:'🎚️',image:'images/potentiometer.png',name:'Potentiometer',category:'Input · Analog',desc:'Rotary analog knob — varies resistance smoothly from 0 to max.',tags:['analogRead()','Knob','Variable resistor'],tagTeal:'Input',level:1,badge:'',badgeClass:'',color:'#181818',descFull:'A potentiometer is a variable resistor with three pins. The outer two pins connect to power and ground; the middle (wiper) pin gives an analog voltage between 0V and 5V as you turn the knob. Arduino reads this as a value 0–1023 with analogRead().',uses:['Volume/brightness control','Servo position control','Menu navigation','Calibration input'],pinout:[{pin:'Left pin',arduino:'5V',notes:'Power supply end',type:'orange'},{pin:'Middle (wiper)',arduino:'A0–A5',notes:'Analog signal 0–1023',type:'teal'},{pin:'Right pin',arduino:'GND',notes:'Ground end',type:''}],code:`<span class="kw">const</span> <span class="st">int</span> pot = A0;\n<span class="kw">void</span> <span class="fn">setup</span>() { Serial.<span class="fn">begin</span>(<span class="nm">9600</span>); }\n<span class="kw">void</span> <span class="fn">loop</span>() {\n  <span class="st">int</span> val = <span class="fn">analogRead</span>(pot);\n  <span class="st">int</span> mapped = <span class="fn">map</span>(val,<span class="nm">0</span>,<span class="nm">1023</span>,<span class="nm">0</span>,<span class="nm">180</span>);\n  Serial.<span class="fn">println</span>(mapped);\n  <span class="fn">delay</span>(<span class="nm">100</span>);\n}`,tip:'Use map(val, 0, 1023, minOut, maxOut) to convert the 0–1023 range to whatever range you need.',circuits:[{src:'images/potentiometer-ON.png',caption:'Pot Wiring — ON (No Code)',height:'350px',objectFit:'contain',cols:2},{src:'images/potentiometer-OFF.png',caption:'Pot Wiring — OFF (No Code)',height:'350px',objectFit:'contain',cols:2},{src:'images/potentiometer-Data.png',caption:'Pot Wiring — Data Reading',height:'350px',objectFit:'contain'}]},
  {emoji:'🔘',image:'images/push-button.png',name:'Push Button',category:'Input · Digital',desc:'Reads HIGH or LOW when pressed. Use digitalRead() to detect button presses.',tags:['digitalRead()','Pull-up resistor','Debouncing'],tagTeal:'Input',level:1,badge:'Basic',badgeClass:'',color:'#080e08',descFull:'A push button is a momentary switch that connects two circuit points when pressed. Arduino\'s internal pull-up resistor (INPUT_PULLUP) keeps the pin HIGH when not pressed and reads LOW when pressed.',uses:['Triggering actions (start/stop, toggle, select)','Menu navigation in LCD projects','Resetting a counter or timer','Debounced input for reliable readings'],pinout:[{pin:'Pin 1 (one side)',arduino:'Digital Pin (e.g. 2)',notes:'With INPUT_PULLUP',type:'teal'},{pin:'Pin 2 (other side)',arduino:'GND',notes:'Direct ground',type:''}],code:`<span class="kw">const</span> <span class="st">int</span> btnPin = <span class="nm">2</span>, ledPin = <span class="nm">13</span>;\n<span class="kw">void</span> <span class="fn">setup</span>() {\n  <span class="fn">pinMode</span>(btnPin, INPUT_PULLUP);\n  <span class="fn">pinMode</span>(ledPin, OUTPUT);\n}\n<span class="kw">void</span> <span class="fn">loop</span>() {\n  <span class="kw">if</span> (<span class="fn">digitalRead</span>(btnPin) == LOW) <span class="fn">digitalWrite</span>(ledPin, HIGH);\n  <span class="kw">else</span> <span class="fn">digitalWrite</span>(ledPin, LOW);\n}`,tip:'Add a small delay (10–50ms) after detecting a press to debounce the button and prevent multiple readings from one physical press.',circuits:[{src:'images/p1s3.png',caption:'Button Wiring',height:'300px',objectFit:'contain',cols:2}, {src:'images/button-wiring-code.png',caption:'Button Wiring with code',height:'300px',objectFit:'contain',cols:2}]},
  {emoji:'🌈',image:'images/rgb.png',name:'RGB LED',category:'Output · Light',desc:'Mix red, green, blue with PWM to make any color from a single component.',tags:['analogWrite()','PWM mixing','Common cathode'],tagTeal:'Output',level:1,badge:'',badgeClass:'',color:'#100a1a',descFull:'An RGB LED contains three separate LEDs (red, green, blue) in one package. By mixing the brightness of each color using PWM (0–255), you can produce millions of colors.',uses:['Status indicator with color coding','Mood lighting projects','Color mixing demonstrations','Visual feedback in games'],pinout:[{pin:'Red leg',arduino:'PWM Pin (e.g. 9)',notes:'220Ω resistor',type:'teal'},{pin:'Common (longest)',arduino:'GND',notes:'Common cathode',type:''},{pin:'Green leg',arduino:'PWM Pin (e.g. 10)',notes:'220Ω resistor',type:'teal'},{pin:'Blue leg',arduino:'PWM Pin (e.g. 11)',notes:'220Ω resistor',type:'teal'}],code:`<span class="kw">void</span> <span class="fn">setColor</span>(<span class="st">int</span> r, <span class="st">int</span> g, <span class="st">int</span> b) {\n  <span class="fn">analogWrite</span>(<span class="nm">9</span>,r); <span class="fn">analogWrite</span>(<span class="nm">10</span>,g); <span class="fn">analogWrite</span>(<span class="nm">11</span>,b);\n}\n<span class="kw">void</span> <span class="fn">loop</span>() {\n  <span class="fn">setColor</span>(<span class="nm">255</span>,<span class="nm">0</span>,<span class="nm">0</span>); <span class="fn">delay</span>(<span class="nm">500</span>); <span class="cm">// Red</span>\n  <span class="fn">setColor</span>(<span class="nm">0</span>,<span class="nm">255</span>,<span class="nm">0</span>); <span class="fn">delay</span>(<span class="nm">500</span>); <span class="cm">// Green</span>\n  <span class="fn">setColor</span>(<span class="nm">0</span>,<span class="nm">0</span>,<span class="nm">255</span>); <span class="fn">delay</span>(<span class="nm">500</span>); <span class="cm">// Blue</span>\n}`,tip:'PWM pins on Uno: 3, 5, 6, 9, 10, 11. Use those for RGB to enable full 0–255 brightness control.',circuits:[{src:'images/rgb-wiring.png',caption:'RGB LED Wiring',height:'300px',cols:1,objectFit:'contain'},{src:'images/rgb-code.png',caption:'RGB with Code',height:'300px',cols:1,objectFit:'contain'}]},
  {emoji:'✨',image:null,name:'NeoPixel Strip',category:'Output · Light',desc:'Addressable RGB LEDs — control each pixel\'s own color individually over a single data wire.',tags:['FastLED.h','Addressable','1-wire'],tagTeal:'Output',level:2,badge:'',badgeClass:'',color:'#10001a',descFull:'A NeoPixel (WS2812B) strip contains many individually addressable RGB LEDs chained on one data line — each pixel has its own tiny controller chip, so you set every LED to a different color from code. This is different from a single RGB LED, which only mixes one color at a time across all three of its internal LEDs.',uses:['Ambient lighting and room decor','Scrolling color effects and animations','Wearable and costume lighting','Status bars showing multiple values at once'],pinout:[{pin:'DIN',arduino:'Digital Pin (e.g. 6)',notes:'Add a 300–500Ω resistor',type:'teal'},{pin:'5V',arduino:'5V (external supply for long strips)',notes:'~60mA per LED at full white',type:'orange'},{pin:'GND',arduino:'GND',notes:'Shared ground',type:''}],code:`<span class="kw">#include</span> <span class="st">&lt;FastLED.h&gt;</span>\n<span class="kw">#define</span> LED_PIN <span class="nm">6</span>\n<span class="kw">#define</span> NUM_LEDS <span class="nm">8</span>\nCRGB leds[NUM_LEDS];\n\n<span class="kw">void</span> <span class="fn">setup</span>() {\n  FastLED.<span class="fn">addLeds</span>&lt;WS2812B,LED_PIN,GRB&gt;(leds,NUM_LEDS);\n}\n<span class="kw">void</span> <span class="fn">loop</span>() {\n  <span class="kw">for</span> (<span class="dt">int</span> i = <span class="nm">0</span>; i &lt; NUM_LEDS; i++) {\n    leds[i] = CHSV(i * <span class="nm">32</span>, <span class="nm">255</span>, <span class="nm">255</span>); <span class="cm">// each pixel its own color</span>\n  }\n  FastLED.<span class="fn">show</span>(); <span class="cm">// push the colors to the strip</span>\n  <span class="fn">delay</span>(<span class="nm">50</span>);\n}`,tip:'Each white LED can draw ~60mA, so a 30-LED strip at full brightness needs up to 1.8A — far more than the Arduino 5V pin can supply. Power longer strips from an external 5V source and share GND with the Arduino.'},
  {emoji:'🔊',image:'images/buzzer.png',name:'Buzzer',category:'Output · Audio',desc:'Piezo buzzer for tones, alarms, and melodies using tone() and frequency.',tags:['tone()','PWM freq','noTone()'],tagTeal:'Audio',level:1,badge:'',badgeClass:'',color:'#100008',descFull:'A passive piezo buzzer vibrates at the frequency you give it, letting you play musical notes and custom tones. Use tone(pin, frequency, duration) to play a note and noTone(pin) to stop.',uses:['Alarm and alert systems','Melodies for notifications','Morse code signaling','Game sound effects'],pinout:[{pin:'Positive (+)',arduino:'Digital Pin (e.g. 8)',notes:'PWM preferred',type:'teal'},{pin:'Negative (−)',arduino:'GND',notes:'Ground',type:''}],code:`<span class="kw">const</span> <span class="st">int</span> buzzer = <span class="nm">8</span>;\n<span class="kw">void</span> <span class="fn">loop</span>() {\n  <span class="fn">tone</span>(buzzer, <span class="nm">262</span>, <span class="nm">300</span>); <span class="fn">delay</span>(<span class="nm">350</span>); <span class="cm">// C4</span>\n  <span class="fn">tone</span>(buzzer, <span class="nm">330</span>, <span class="nm">300</span>); <span class="fn">delay</span>(<span class="nm">350</span>); <span class="cm">// E4</span>\n  <span class="fn">tone</span>(buzzer, <span class="nm">392</span>, <span class="nm">300</span>); <span class="fn">delay</span>(<span class="nm">350</span>); <span class="cm">// G4</span>\n  <span class="fn">noTone</span>(buzzer); <span class="fn">delay</span>(<span class="nm">1000</span>);\n}`,tip:'tone() uses Arduino Timer 2, which affects PWM on pins 3 and 11. Avoid using those pins for analogWrite() when tone() is active.',circuits:[{src:'images/buzzer-wiring.png',caption:'Buzzer Wiring',height:'300px',objectFit:'contain',cols:2}]},
  {emoji:'☀️',image:'images/light-sensor.png',name:'Light Sensor',category:'Sensor · Light',desc:'Detects brightness using an LDR (Light Dependent Resistor).',tags:['analogRead()','LDR','Day/Night'],tagTeal:'Sensor',level:1,badge:'',badgeClass:'',color:'#1a1800',descFull:'An LDR (photoresistor) changes resistance based on light intensity. Used in a voltage divider with a fixed resistor, it produces an analog voltage that Arduino reads. Bright light = low resistance = high voltage reading.',uses:['Automatic street lamp','Solar tracker','Day/night alarm','Light-controlled LED dimmer'],pinout:[{pin:'Signal',arduino:'A0',notes:'Analog 0–1023',type:'teal'},{pin:'VCC',arduino:'5V',notes:'Power',type:'orange'},{pin:'GND',arduino:'GND',notes:'Ground',type:''}],code:`<span class="kw">const</span> <span class="st">int</span> ldr = A0;\n<span class="kw">void</span> <span class="fn">setup</span>() { Serial.<span class="fn">begin</span>(<span class="nm">9600</span>); }\n<span class="kw">void</span> <span class="fn">loop</span>() {\n  <span class="st">int</span> value = <span class="fn">analogRead</span>(ldr);\n  Serial.<span class="fn">println</span>(value);\n  <span class="fn">delay</span>(<span class="nm">500</span>);\n}`,tip:'The reading direction depends on how you wire the voltage divider. Test both ways and use the one that makes sense for your project.',circuits:[{src:'images/light-sensor-positive.png',caption:'Voltage Divider Positive Diagram',cols:2,objectFit:'fill',height:'550px'},{src:'images/light-sensor-negative.png',caption:'Voltage Divider Negative Diagram',cols:2,objectFit:'fill',height:'550px'}]},
  {emoji:'🎨',image:'images/tcs230.webp',name:'TCS230 Color Sensor',category:'Sensor · Color',desc:'Detects surface color by measuring reflected red, green, and blue light intensities.',tags:['TCS230','TCS3200','Color detection'],tagTeal:'Sensor',level:3,badge:'',badgeClass:'',color:'#0a1200',descFull:'The TCS230/TCS3200 color sensor module uses an 8×8 array of photodiodes filtered for red, green, blue, and clear light. It outputs a square wave whose frequency is proportional to the detected light intensity of the selected channel. Select the active channel using the S2 and S3 control pins.',uses:['Color-sorting conveyor robots','Fruit ripeness detection','Paint or product color quality control','Line following with color-coded tracks'],pinout:[{pin:'VCC',arduino:'5V',notes:'Power supply',type:'orange'},{pin:'GND',arduino:'GND',notes:'Ground',type:''},{pin:'S0',arduino:'Digital Pin (e.g. 4)',notes:'Output frequency scaling',type:'teal'},{pin:'S1',arduino:'Digital Pin (e.g. 5)',notes:'Output frequency scaling',type:'teal'},{pin:'S2',arduino:'Digital Pin (e.g. 6)',notes:'Photodiode type select',type:'teal'},{pin:'S3',arduino:'Digital Pin (e.g. 7)',notes:'Photodiode type select',type:'teal'},{pin:'OUT',arduino:'Digital Pin (e.g. 8)',notes:'Frequency output signal',type:'teal'}],code:`<span class="kw">const</span> <span class="st">int</span> s0=<span class="nm">4</span>,s1=<span class="nm">5</span>,s2=<span class="nm">6</span>,s3=<span class="nm">7</span>,out=<span class="nm">8</span>;\n<span class="kw">void</span> <span class="fn">setup</span>() {\n  <span class="fn">pinMode</span>(s0,OUTPUT); <span class="fn">pinMode</span>(s1,OUTPUT);\n  <span class="fn">pinMode</span>(s2,OUTPUT); <span class="fn">pinMode</span>(s3,OUTPUT);\n  <span class="fn">pinMode</span>(out,INPUT);\n  <span class="fn">digitalWrite</span>(s0,HIGH); <span class="fn">digitalWrite</span>(s1,LOW); <span class="cm">// 20% scaling</span>\n  Serial.<span class="fn">begin</span>(<span class="nm">9600</span>);\n}\n<span class="kw">long</span> <span class="fn">readColor</span>(<span class="st">bool</span> s2v, <span class="st">bool</span> s3v) {\n  <span class="fn">digitalWrite</span>(s2,s2v); <span class="fn">digitalWrite</span>(s3,s3v);\n  <span class="kw">return</span> <span class="fn">pulseIn</span>(out,LOW);\n}\n<span class="kw">void</span> <span class="fn">loop</span>() {\n  Serial.<span class="fn">print</span>(<span class="st">"R:"</span>); Serial.<span class="fn">print</span>(<span class="fn">readColor</span>(LOW,LOW));\n  Serial.<span class="fn">print</span>(<span class="st">" G:"</span>); Serial.<span class="fn">print</span>(<span class="fn">readColor</span>(HIGH,HIGH));\n  Serial.<span class="fn">print</span>(<span class="st">" B:"</span>); Serial.<span class="fn">println</span>(<span class="fn">readColor</span>(LOW,HIGH));\n  <span class="fn">delay</span>(<span class="nm">500</span>);\n}`,tip:'Lower pulse duration = more of that color present. Calibrate by reading a white surface (max) and black surface (min) for each channel, then use map() to normalise to 0–255.',circuits:[{src:'images/tcs230-pinout.webp',caption:'TCS230 Color Sensor Pinout',cols:2,objectFit:'contain',height:'500px'},{src:'images/tcs230-wiring.png',caption:'TCS230 Color Sensor Wiring',cols:2,objectFit:'contain',height:'500px'}]},
  {emoji:'🎤',image:'images/sound-sensor.png',name:'Sound Sensor',category:'Sensor · Audio',desc:'Detects sound level with a microphone module.',tags:['Mic','analogRead()','Clap detect'],tagTeal:'Sensor',level:1,badge:'',badgeClass:'',color:'#14000c',descFull:'The sound sensor module has a small electret microphone and an amplifier. The analog output gives the sound level (0–1023) and the digital output triggers HIGH or LOW when sound crosses a threshold.',uses:['Clap switch (clap to toggle light)','Noise level monitoring','Sound-triggered camera','Robot that reacts to sound'],pinout:[{pin:'AOUT',arduino:'A0',notes:'Analog sound level',type:'teal'},{pin:'DOUT',arduino:'Digital pin',notes:'HIGH/LOW at threshold',type:'teal'},{pin:'VCC',arduino:'5V',notes:'Power',type:'orange'},{pin:'GND',arduino:'GND',notes:'Ground',type:''}],code:`<span class="kw">const</span> <span class="st">int</span> mic = A0, led = <span class="nm">13</span>;\n<span class="kw">const</span> <span class="st">int</span> threshold = <span class="nm">600</span>;\n<span class="kw">void</span> <span class="fn">setup</span>() { <span class="fn">pinMode</span>(led, OUTPUT); Serial.<span class="fn">begin</span>(<span class="nm">9600</span>); }\n<span class="kw">void</span> <span class="fn">loop</span>() {\n  <span class="st">int</span> sound = <span class="fn">analogRead</span>(mic);\n  <span class="kw">if</span> (sound > threshold) { <span class="fn">digitalWrite</span>(led,HIGH); <span class="fn">delay</span>(<span class="nm">500</span>); <span class="fn">digitalWrite</span>(led,LOW); }\n}`,tip:'Adjust the potentiometer on the module to set the sensitivity threshold for the digital output.',circuits:[{src:'images/sound-sensor1.webp',caption:'Microphone Module V1',objectFit:'contain'},{src:'images/sound-sensor2.avif',caption:'Microphone Module V2',objectFit:'contain'},{src:'images/sound-sensor-wiring.jpg',caption:'Microphone Module Wiring',cols:2,objectFit:'fill',height:'550px'}]},
  {emoji:'🔥',image:'images/flame-sensor.png',name:'Flame Sensor',category:'Sensor · Safety',desc:'Detects infrared light from a flame. Build fire alert systems.',tags:['IR','Alarm','Safety'],tagTeal:'Sensor',level:2,badge:'',badgeClass:'',color:'#1a0500',descFull:'The flame sensor detects infrared (IR) light emitted by a flame. It has both analog and digital outputs. The digital output goes LOW when flame is detected (active LOW). Detection range is ~80cm at a 60° angle.',uses:['Fire alert system','Safety robot that avoids fire','Candle-following robot','Industrial safety shutdown'],pinout:[{pin:'DOUT',arduino:'Digital pin (e.g. 2)',notes:'LOW when flame detected',type:'teal'},{pin:'AOUT',arduino:'A0',notes:'Analog intensity level',type:'teal'},{pin:'VCC',arduino:'5V',notes:'Power',type:'orange'},{pin:'GND',arduino:'GND',notes:'Ground',type:''}],code:`<span class="kw">const</span> <span class="st">int</span> flame = <span class="nm">2</span>, led = <span class="nm">13</span>;\n<span class="kw">void</span> <span class="fn">setup</span>() { <span class="fn">pinMode</span>(flame,INPUT); <span class="fn">pinMode</span>(led,OUTPUT); Serial.<span class="fn">begin</span>(<span class="nm">9600</span>); }\n<span class="kw">void</span> <span class="fn">loop</span>() {\n  <span class="kw">if</span> (<span class="fn">digitalRead</span>(flame)==LOW) {\n    <span class="fn">digitalWrite</span>(led,HIGH); Serial.<span class="fn">println</span>(<span class="st">"FLAME!"</span>);\n  } <span class="kw">else</span> <span class="fn">digitalWrite</span>(led,LOW);\n}`,tip:'Many flame sensor modules trigger LOW (not HIGH) when flame is detected — active LOW logic. Test with a lighter at arm\'s length first.',circuits:[{src:'images/flame-wiring.jpg',caption:'Flame Sensor Wiring',cols:2,objectFit:'fill', height:'700px'}]},
  {emoji:'🌡️',image:'images/lm35.png',name:'LM35 Temp Sensor',category:'Sensor · Environment',desc:'Analog temperature sensor outputting 10mV per °C. Simple, accurate, no library needed.',tags:['analogRead()','10mV/°C','No library'],tagTeal:'Sensor',level:1,badge:'',badgeClass:'',color:'#0e0800',descFull:'The LM35 is a precision analog temperature sensor that outputs a voltage linearly proportional to temperature at exactly 10mV per °C. Unlike the DHT11, it requires no library — simply read the analog voltage and convert using a formula. It can measure from −55°C to +150°C with ±0.5°C accuracy.',uses:['Room temperature monitoring','Overheating protection for motors or circuits','Weather station readout','Thermostat and fan control systems'],pinout:[{pin:'VCC (Pin 1)',arduino:'5V',notes:'Power supply',type:'orange'},{pin:'Vout (Pin 2)',arduino:'A0–A5',notes:'Analog voltage output',type:'teal'},{pin:'GND (Pin 3)',arduino:'GND',notes:'Ground',type:''}],code:`<span class="kw">const</span> <span class="st">int</span> lm35=A1;\n<span class="kw">void</span> <span class="fn">setup</span>() { Serial.<span class="fn">begin</span>(<span class="nm">9600</span>); }\n<span class="kw">void</span> <span class="fn">loop</span>() {\n  <span class="st">int</span> raw = <span class="fn">analogRead</span>(lm35);\n  <span class="st">float</span> mV  = raw * (<span class="nm">5000.0</span> / <span class="nm">1023.0</span>);\n  <span class="st">float</span> degC = mV / <span class="nm">10.0</span>;\n  Serial.<span class="fn">print</span>(<span class="st">"Temp: "</span>);\n  Serial.<span class="fn">print</span>(degC);\n  Serial.<span class="fn">println</span>(<span class="st">" C"</span>);\n  <span class="fn">delay</span>(<span class="nm">1000</span>);\n}`,tip:'For a 3.3V Arduino board, change 5000.0 to 3300.0 in the formula. Keep the LM35 away from heat sources like voltage regulators on the board itself.',circuits:[{src:'images/lm35-pinout.jpg',caption:'LM35 Pinout',cols:2,objectFit:'contain',height:'500px'},{src:'images/lm35-wiring.webp',caption:'LM35 Wiring',cols:2,objectFit:'contain',height:'500px'}]},
  {emoji:'🌡️',image:'images/DHT11.png',name:'DHT11 / DHT22 Sensor',category:'Sensor · Environment',desc:'DHT11/DHT22 reads temperature and humidity. Perfect for weather stations.',tags:['DHT library','I2C','Analog read'],tagTeal:'Sensor',level:2,badge:'Popular',badgeClass:'',color:'#08080e',descFull:'The DHT11 and DHT22 are digital temperature and humidity sensors. DHT22 is more accurate (±0.5°C) vs DHT11 (±2°C). Install the "DHT sensor library" by Adafruit via the Arduino Library Manager before using.',uses:['Weather station displays','Smart greenhouse climate control','Indoor air quality monitoring','HVAC control systems'],pinout:[{pin:'VCC (Pin 1)',arduino:'5V',notes:'Power supply',type:'orange'},{pin:'DATA (Pin 2)',arduino:'Digital Pin (e.g. 4)',notes:'With 10kΩ pull-up to VCC',type:'teal'},{pin:'NC (Pin 3)',arduino:'—',notes:'Not connected',type:''},{pin:'GND (Pin 4)',arduino:'GND',notes:'Ground',type:''}],code:`<span class="kw">#include</span> <span class="st">&lt;DHT.h&gt;</span>\n<span class="kw">#define</span> DHTPIN <span class="nm">6</span>\n<span class="kw">#define</span> DHTTYPE DHT22\nDHT <span class="fn">dht</span>(DHTPIN, DHTTYPE);\n<span class="kw">void</span> <span class="fn">setup</span>() { Serial.<span class="fn">begin</span>(<span class="nm">9600</span>); dht.<span class="fn">begin</span>(); }\n<span class="kw">void</span> <span class="fn">loop</span>() {\n  Serial.<span class="fn">print</span>(<span class="st">"T:"</span>); Serial.<span class="fn">print</span>(dht.<span class="fn">readTemperature</span>());\n  Serial.<span class="fn">print</span>(<span class="st">" H:"</span>); Serial.<span class="fn">println</span>(dht.<span class="fn">readHumidity</span>());\n  <span class="fn">delay</span>(<span class="nm">2000</span>);\n}`,tip:'Wait at least 2 seconds between readings — the DHT sensor needs time to sample. Faster polling returns NaN errors.',circuits:[{src:'images/dht-wiring.png',caption:'DHT11/22 Wiring',cols:2,objectFit:'fill',height:'550px'}]},
  {emoji:'💧',image:'images/moisture.png',name:'Moisture Sensor',category:'Sensor · Environment',desc:'Measures soil water content. Build automatic plant watering systems.',tags:['analogRead()','Soil probe','Threshold logic'],tagTeal:'Sensor',level:2,badge:'',badgeClass:'',color:'#001a10',descFull:'The soil moisture sensor has two probes that measure electrical resistance through soil. Wet soil = lower resistance → lower analogRead value. Dry soil = higher resistance → higher analogRead value.',uses:['Automatic plant irrigation systems','Agricultural monitoring','Hydroponics water level detection','Smart garden alerts'],pinout:[{pin:'VCC',arduino:'3.3V or 5V',notes:'Power only when reading',type:'orange'},{pin:'GND',arduino:'GND',notes:'Ground',type:''},{pin:'AOUT (Analog)',arduino:'A0–A5',notes:'0=wet, 1023=dry',type:'teal'},{pin:'DOUT (Digital)',arduino:'Digital pin',notes:'HIGH when dry',type:'teal'}],code:`<span class="kw">const</span> <span class="st">int</span> sensorPin=A0, pumpPin=<span class="nm">7</span>;\n<span class="kw">void</span> <span class="fn">loop</span>() {\n  <span class="st">int</span> val = <span class="fn">analogRead</span>(sensorPin);\n  <span class="kw">if</span> (val > <span class="nm">600</span>) <span class="fn">digitalWrite</span>(pumpPin,HIGH); <span class="cm">// dry → pump on</span>\n  <span class="kw">else</span> <span class="fn">digitalWrite</span>(pumpPin,LOW);\n  <span class="fn">delay</span>(<span class="nm">1000</span>);\n}`,tip:'Power the sensor only during readings — leaving it powered continuously oxidizes the probes and shortens their life.',circuits:[{src:'images/moisture-wiring.png',caption:'Moisture Sensor Wiring',cols:2 , objectFit:'contain', height:'800px'}]},
  {emoji:'🧲',image:'images/ir.png',name:'IR Receiver (Remote Control)',category:'Sensor · Input',desc:'Decodes signals from infrared remote controls, like a TV or AC remote.',tags:['IRremote.h','38kHz demod','Remote decode'],tagTeal:'Sensor',level:2,badge:'',badgeClass:'',color:'#1a0010',descFull:'This is a dedicated IR receiver module (e.g. TSOP38238) tuned to detect the 38kHz pulses used by TV/AC remotes — it only has one output pin and needs the IRremote library to decode the button codes. It is a different part from a line-following IR module: those have their own onboard IR LED + phototransistor pair to detect reflected light off the floor, use no library, and won\'t decode remote signals at all.',uses:['TV/AC remote control input','Universal remote / macro button projects','Controlling a robot with a spare remote','Learning and replaying remote codes for automation'],pinout:[{pin:'VCC',arduino:'5V',notes:'Power',type:'orange'},{pin:'GND',arduino:'GND',notes:'Ground',type:''},{pin:'OUT (receiver)',arduino:'Digital Pin (e.g. 11)',notes:'Signal output',type:'teal'}],code:`<span class="kw">#include</span> <span class="st">&lt;IRremote.h&gt;</span>\nIRrecv <span class="fn">ir</span>(<span class="nm">11</span>);\n<span class="kw">void</span> <span class="fn">setup</span>() { Serial.<span class="fn">begin</span>(<span class="nm">9600</span>); ir.<span class="fn">enableIRIn</span>(); }\n<span class="kw">void</span> <span class="fn">loop</span>() {\n  <span class="kw">if</span> (ir.<span class="fn">decode</span>()) {\n    Serial.<span class="fn">println</span>(ir.decodedIRData.decodedRawData, HEX);\n    ir.<span class="fn">resume</span>();\n  }\n}`,tip:'IR receivers are sensitive to ambient light (sunlight, fluorescent bulbs) and to other nearby 38kHz sources. If you actually want a line-following robot, look for a dedicated "IR line tracking sensor" module instead — this remote-control receiver won\'t work for that.',circuits:[{src:'images/ir-wiring.png',caption:'IR Receiver Wiring',cols:2,height:'500px',objectFit:'contain'}]},
  {emoji:'🌬️',image:'images/mq2.png',name:'Gas Sensor MQ-2',category:'Sensor · Safety',desc:'Detects flammable gases and smoke. Build fire alarms and gas leak detectors.',tags:['MQ-2','analogRead()','Safety system'],tagTeal:'Safety',level:2,badge:'Hot',badgeClass:'hot',color:'#0a1a00',descFull:'The MQ-2 gas sensor detects LPG, smoke, alcohol, propane, hydrogen, methane, and carbon monoxide. It has a warm-up time of about 20 seconds.',uses:['Gas leak detectors','Fire and smoke alarms','Air quality monitoring','Safety shutdown systems'],pinout:[{pin:'VCC',arduino:'5V',notes:'Power (draws ~150mA)',type:'orange'},{pin:'GND',arduino:'GND',notes:'Ground',type:''},{pin:'AOUT',arduino:'A0',notes:'Analog concentration reading',type:'teal'},{pin:'DOUT',arduino:'Digital pin',notes:'HIGH when gas detected',type:'teal'}],code:`<span class="kw">const</span> <span class="st">int</span> mq2=A0, buz=<span class="nm">8</span>;\n<span class="kw">const</span> <span class="st">int</span> threshold=<span class="nm">400</span>;\n<span class="kw">void</span> <span class="fn">setup</span>() { Serial.<span class="fn">begin</span>(<span class="nm">9600</span>); <span class="fn">delay</span>(<span class="nm">20000</span>); <span class="cm">// warm-up</span> }\n<span class="kw">void</span> <span class="fn">loop</span>() {\n  <span class="st">int</span> val=<span class="fn">analogRead</span>(mq2);\n  <span class="fn">digitalWrite</span>(buz, val>threshold?HIGH:LOW);\n  <span class="fn">delay</span>(<span class="nm">200</span>);\n}`,tip:'MQ-2 requires a 20-second warm-up before accurate readings. Add a startup delay() or "warming up…" message.',circuits:[{src:'images/mq2-wiring.png',caption:'MQ-2 Wiring',cols:2,height:'500px',objectFit:'contain' }]},
  {emoji:'🏃',image:'images/pir.png',name:'PIR Motion',category:'Sensor · Security',desc:'Detects human movement with passive infrared. Build motion-activated systems.',tags:['PIR module','digitalRead()','Security'],tagTeal:'Sensor',level:1,badge:'',badgeClass:'',color:'#001a18',descFull:'A PIR (Passive Infrared) sensor detects movement by measuring changes in infrared radiation emitted by warm bodies. Detection angle ~110° with range 3–7 meters. Sensitivity and hold time adjustable.',uses:['Motion-activated lights','Security camera triggers','Occupancy detection for HVAC','Intruder alarm systems'],pinout:[{pin:'VCC',arduino:'5V',notes:'Power',type:'orange'},{pin:'OUT',arduino:'Digital Pin (e.g. 3)',notes:'HIGH when motion detected',type:'teal'},{pin:'GND',arduino:'GND',notes:'Ground',type:''}],code:`<span class="kw">const</span> <span class="st">int</span> pirPin=<span class="nm">3</span>, ledPin=<span class="nm">13</span>;\n<span class="kw">void</span> <span class="fn">setup</span>() {\n  <span class="fn">pinMode</span>(pirPin,INPUT); <span class="fn">pinMode</span>(ledPin,OUTPUT);\n  <span class="fn">delay</span>(<span class="nm">30000</span>); <span class="cm">// calibration</span>\n}\n<span class="kw">void</span> <span class="fn">loop</span>() {\n  <span class="kw">if</span>(<span class="fn">digitalRead</span>(pirPin)==HIGH) { <span class="fn">digitalWrite</span>(ledPin,HIGH); Serial.<span class="fn">println</span>(<span class="st">"Motion!"</span>); }\n  <span class="kw">else</span> <span class="fn">digitalWrite</span>(ledPin,LOW);\n}`,tip:'Give the PIR sensor a 30-second warm-up time in setup for accurate calibration.',circuits:[{src:'images/pir1.png',caption:'PIR Sensor Pin Out',height:'500px',objectFit:'contain' },{src:'images/pir-wiring.png',caption:'PIR Sensor Wiring',cols:2,height:'500px',objectFit:'contain' }]},
  {emoji:'📷',image:'images/rifd.png',name:'RFID RC522',category:'Module · Security',desc:'Read/write RFID cards. Build door locks, access control, attendance systems.',tags:['RC522','SPI bus','MFRC522 lib'],tagTeal:'Module',level:3,badge:'New',badgeClass:'',color:'#00101a',descFull:'The MFRC522 RFID module reads and writes 13.56 MHz RFID/NFC cards and key fobs using SPI communication. Each card has a unique 4-byte UID.',uses:['Door lock access control','Student/employee attendance','Library card management','Product authentication'],pinout:[{pin:'3.3V',arduino:'3.3V',notes:'⚠️ NOT 5V — will damage module',type:'orange'},{pin:'GND',arduino:'GND',notes:'Ground',type:''},{pin:'RST',arduino:'Pin 9',notes:'Reset',type:'teal'},{pin:'SDA (SS)',arduino:'Pin 10',notes:'SPI chip select',type:'teal'},{pin:'MOSI',arduino:'Pin 11',notes:'SPI data out',type:'teal'},{pin:'MISO',arduino:'Pin 12',notes:'SPI data in',type:'teal'},{pin:'SCK',arduino:'Pin 13',notes:'SPI clock',type:'teal'}],code:`<span class="kw">#include</span> <span class="st">&lt;SPI.h&gt;</span>\n<span class="kw">#include</span> <span class="st">&lt;MFRC522.h&gt;</span>\nMFRC522 <span class="fn">rfid</span>(<span class="nm">10</span>,<span class="nm">9</span>);\n<span class="kw">void</span> <span class="fn">setup</span>() { SPI.<span class="fn">begin</span>(); rfid.<span class="fn">PCD_Init</span>(); Serial.<span class="fn">begin</span>(<span class="nm">9600</span>); }\n<span class="kw">void</span> <span class="fn">loop</span>() {\n  <span class="kw">if</span>(!rfid.<span class="fn">PICC_IsNewCardPresent</span>()) <span class="kw">return</span>;\n  rfid.<span class="fn">PICC_ReadCardSerial</span>();\n  <span class="kw">for</span>(<span class="st">byte</span> i=<span class="nm">0</span>;i&lt;rfid.uid.size;i++) Serial.<span class="fn">print</span>(rfid.uid.uidByte[i],HEX);\n  rfid.<span class="fn">PICC_HaltA</span>();\n}`,tip:'The RC522 runs on 3.3V logic only. Never connect it to 5V — it will be permanently damaged.',circuits:[{src:'images/rfid.webp',caption:'RFID RC522 Pin outs',cols:2,objectFit:'contain', height:'500px'},{src:'images/rfid-wiring.png',caption:'RFID RC522 Wiring',cols:2,objectFit:'contain', height:'500px'}]},
  {emoji:'💾',image:null,name:'Micro SD Card Module',category:'Module · Storage',desc:'Read and write files on a Micro SD card over SPI — for logging data that survives a power cycle.',tags:['SD.h','SPI bus','CSV logging'],tagTeal:'Module',level:2,badge:'',badgeClass:'',color:'#0a1a10',descFull:'The SD card module lets Arduino read and write files on a FAT16/FAT32-formatted Micro SD card using the SPI bus — the same bus as the RFID RC522, so they share MOSI/MISO/SCK and only need their own chip-select (CS) pin. This turns Arduino into something that can log data long-term (sensor readings, timestamps, event logs) instead of just printing to Serial, which is lost the moment it disconnects from a computer.',uses:['Data-logging sensor readings over hours or days','Saving timestamped logs (pair with an RTC module)','Storing settings/config files between power cycles','Playing back audio or bitmap files for OLED/TFT screens'],pinout:[{pin:'CS',arduino:'Digital Pin (e.g. 4 or 10)',notes:'SPI chip select',type:'teal'},{pin:'MOSI',arduino:'Pin 11',notes:'SPI data out (shared bus)',type:'teal'},{pin:'MISO',arduino:'Pin 12',notes:'SPI data in (shared bus)',type:'teal'},{pin:'SCK',arduino:'Pin 13',notes:'SPI clock (shared bus)',type:'teal'},{pin:'VCC',arduino:'5V',notes:'Power',type:'orange'},{pin:'GND',arduino:'GND',notes:'Ground',type:''}],code:`<span class="kw">#include</span> <span class="st">&lt;SPI.h&gt;</span>\n<span class="kw">#include</span> <span class="st">&lt;SD.h&gt;</span>\n<span class="kw">const</span> <span class="dt">int</span> chipSelect = <span class="nm">4</span>;\n\n<span class="kw">void</span> <span class="fn">setup</span>() {\n  Serial.<span class="fn">begin</span>(<span class="nm">9600</span>);\n  <span class="kw">if</span> (!SD.<span class="fn">begin</span>(chipSelect)) { Serial.<span class="fn">println</span>(<span class="st">"Card failed"</span>); <span class="kw">return</span>; }\n\n  File dataFile = SD.<span class="fn">open</span>(<span class="st">"log.txt"</span>, FILE_WRITE);\n  <span class="kw">if</span> (dataFile) {\n    dataFile.<span class="fn">println</span>(<span class="st">"sensor,42"</span>); <span class="cm">// write one line</span>\n    dataFile.<span class="fn">close</span>();\n  }\n}\n<span class="kw">void</span> <span class="fn">loop</span>() { }`,tip:'On most modules the CS pin can be any free digital pin (set it in code), but MOSI/MISO/SCK are fixed by the SPI hardware bus. If you\'re also using an RFID RC522, they can share MOSI/MISO/SCK — just give each module its own CS pin.'},
  {emoji:'🌊',image:'images/water.png',name:'Water Level',category:'Sensor · Environment',desc:'Detects water depth with exposed traces. Build flood alarms and tank monitors.',tags:['analogRead()','Threshold','Pump control'],tagTeal:'Sensor',level:2,badge:'',badgeClass:'',color:'#001020',descFull:'The water level sensor has exposed parallel conductive traces that partially short-circuit when submerged. The more traces submerged, the lower the resistance and the higher the analog reading.',uses:['Flood early-warning systems','Aquarium water level monitoring','Automatic pump controllers','Rain collection measurement'],pinout:[{pin:'S (Signal)',arduino:'A0',notes:'Analog depth reading',type:'teal'},{pin:'+ (Power)',arduino:'Digital pin (power when reading)',notes:'Prevents corrosion',type:'orange'},{pin:'− (GND)',arduino:'GND',notes:'Ground',type:''}],code:`<span class="kw">const</span> <span class="st">int</span> sPin=A5, pwrPin=<span class="nm">7</span>;\n<span class="kw">void</span> <span class="fn">loop</span>() {\n  <span class="fn">digitalWrite</span>(pwrPin,HIGH); <span class="fn">delay</span>(<span class="nm">10</span>);\n  <span class="st">int</span> val=<span class="fn">analogRead</span>(sPin);\n  <span class="fn">digitalWrite</span>(pwrPin,LOW);\n  <span class="kw">if</span>(val&lt;<span class="nm">300</span>) Serial.<span class="fn">println</span>(<span class="st">"Empty"</span>);\n  <span class="kw">else if</span>(val&lt;<span class="nm">600</span>) Serial.<span class="fn">println</span>(<span class="st">"Half"</span>);\n  <span class="kw">else</span> Serial.<span class="fn">println</span>(<span class="st">"Full"</span>);\n  <span class="fn">delay</span>(<span class="nm">1000</span>);\n}`,tip:'Power the sensor through a digital pin and turn it on only during readings. Constant power causes electrolytic corrosion.',circuits:[{src:'images/water-wiring.jpg',caption:'Water Level Sensor Wiring',cols:2,objectFit:'fill',height:'550px'}]},
  {emoji:'📡',image:'images/ultrasonic.png',name:'Ultrasonic',category:'Sensor · Distance',desc:'HC-SR04 measures distance with sound pulses. Powers obstacle-avoidance robots.',tags:['HC-SR04','pulseIn()','Trigger/Echo'],tagTeal:'Sensor',level:2,badge:'',badgeClass:'',color:'#001414',descFull:'The HC-SR04 ultrasonic sensor measures distance by sending a 40kHz sound pulse and timing the echo. Range: 2cm to 400cm with ±3mm accuracy.',uses:['Obstacle detection for robots','Smart parking sensors','Liquid level monitoring','Proximity-based automation'],pinout:[{pin:'VCC',arduino:'5V',notes:'Power',type:'orange'},{pin:'Trig',arduino:'Digital Pin (e.g. 9)',notes:'Trigger pulse out',type:'teal'},{pin:'Echo',arduino:'Digital Pin (e.g. 10)',notes:'Echo pulse in',type:'teal'},{pin:'GND',arduino:'GND',notes:'Ground',type:''}],code:`<span class="kw">const</span> <span class="st">int</span> trig=<span class="nm">9</span>, echo=<span class="nm">10</span>;\n<span class="kw">void</span> <span class="fn">setup</span>() { Serial.<span class="fn">begin</span>(<span class="nm">9600</span>); <span class="fn">pinMode</span>(trig,OUTPUT); <span class="fn">pinMode</span>(echo,INPUT); }\n<span class="kw">void</span> <span class="fn">loop</span>() {\n  <span class="fn">digitalWrite</span>(trig,LOW); <span class="fn">delayMicroseconds</span>(<span class="nm">2</span>);\n  <span class="fn">digitalWrite</span>(trig,HIGH); <span class="fn">delayMicroseconds</span>(<span class="nm">10</span>);\n  <span class="fn">digitalWrite</span>(trig,LOW);\n  <span class="st">float</span> cm = <span class="fn">pulseIn</span>(echo,HIGH)*<span class="nm">0.034</span>/<span class="nm">2</span>;\n  Serial.<span class="fn">println</span>(cm);\n  <span class="fn">delay</span>(<span class="nm">500</span>);\n}`,tip:'The HC-SR04 operates at 5V. If using a 3.3V board, add a voltage divider on the Echo pin to protect it.',circuits:[{src:'images/ultrasonic-wiring.png',caption:'HC-SR04 Wiring',cols:2,objectFit:'contain', height:'500px'}]},
  {emoji:'🔄',image:'images/mpu6050.webp',name:'MPU-6050',category:'Sensor · Motion',desc:'6-axis gyroscope and accelerometer. Detect tilt, rotation, and movement with high precision.',tags:['I2C','MPU6050 lib','6-DOF'],tagTeal:'Sensor',level:2,badge:'Hot',badgeClass:'hot',color:'#0a0a1a',descFull:'The MPU-6050 combines a 3-axis gyroscope and a 3-axis accelerometer in a single chip, communicating over I2C. It measures angular velocity (°/s) and linear acceleration (g-force) on all three axes simultaneously. Install the "MPU6050" library by Electronic Cats via the Library Manager.',uses:['Self-balancing robots','Gesture-controlled projects','Drone and quadcopter stabilisation','Step counter and activity tracker'],pinout:[{pin:'VCC',arduino:'3.3V or 5V',notes:'Power supply',type:'orange'},{pin:'GND',arduino:'GND',notes:'Ground',type:''},{pin:'SCL',arduino:'A5 (SCL)',notes:'I2C clock',type:'teal'},{pin:'SDA',arduino:'A4 (SDA)',notes:'I2C data',type:'teal'},{pin:'INT',arduino:'Digital Pin (e.g. 2)',notes:'Interrupt — optional',type:'teal'}],code:`<span class="kw">#include</span> <span class="st">&lt;Wire.h&gt;</span>\n<span class="kw">#include</span> <span class="st">&lt;MPU6050.h&gt;</span>\nMPU6050 <span class="fn">mpu</span>;\n<span class="kw">void</span> <span class="fn">setup</span>() {\n  Serial.<span class="fn">begin</span>(<span class="nm">9600</span>); Wire.<span class="fn">begin</span>(); mpu.<span class="fn">initialize</span>();\n}\n<span class="kw">void</span> <span class="fn">loop</span>() {\n  <span class="st">int16_t</span> ax,ay,az,gx,gy,gz;\n  mpu.<span class="fn">getMotion6</span>(&ax,&ay,&az,&gx,&gy,&gz);\n  Serial.<span class="fn">print</span>(<span class="st">"aX:"</span>); Serial.<span class="fn">print</span>(ax);\n  Serial.<span class="fn">print</span>(<span class="st">" gX:"</span>); Serial.<span class="fn">println</span>(gx);\n  <span class="fn">delay</span>(<span class="nm">100</span>);\n}`,tip:'Divide raw accelerometer values by 16384 to get g-force, and gyro values by 131 to get °/s in real-world units.',circuits:[{src:'images/mpu6050-pinout.png',caption:'MPU-6050 Pinout',objectFit:'contain',height:'500px'}, {src:'images/mpu6050-wiring.png',caption:'MPU-6050 Wiring',cols:2,objectFit:'contain',height:'500px'}]},
