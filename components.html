  {emoji:'⚙️',image:'images/servo.png',name:'Servo Motor',category:'Output · Motion',desc:'Rotate to precise angles 0°–180°. Great for robot arms and camera mounts.',tags:['Servo library','0°–180°','PWM signal'],tagTeal:'Actuator',level:2,badge:'Hot',badgeClass:'hot',color:'#120800',descFull:'A servo motor is a DC motor with a built-in gearbox and position feedback. It uses PWM signals to rotate to exact positions (0° to 180°). The Arduino Servo library makes this very easy.',uses:['Robot arm joints','Camera pan/tilt rigs','Steering mechanism in RC cars','Door lock mechanisms'],pinout:[{pin:'Signal (Orange/Yellow)',arduino:'PWM Pin (e.g. 9)',notes:'Control signal',type:'teal'},{pin:'Power (Red)',arduino:'5V or External 5V',notes:'Up to 1A per servo',type:'orange'},{pin:'Ground (Brown/Black)',arduino:'GND',notes:'Shared ground',type:''}],code:`<span class="kw">#include</span> <span class="st">&lt;Servo.h&gt;</span>\nServo myServo;\n<span class="kw">void</span> <span class="fn">setup</span>() { myServo.<span class="fn">attach</span>(<span class="nm">9</span>); }\n<span class="kw">void</span> <span class="fn">loop</span>() {\n  myServo.<span class="fn">write</span>(<span class="nm">0</span>);   <span class="fn">delay</span>(<span class="nm">1000</span>);\n  myServo.<span class="fn">write</span>(<span class="nm">90</span>);  <span class="fn">delay</span>(<span class="nm">1000</span>);\n  myServo.<span class="fn">write</span>(<span class="nm">180</span>); <span class="fn">delay</span>(<span class="nm">1000</span>);\n}`,tip:'Multiple servos can brown-out your Arduino\'s 5V pin. Power them from a separate regulated 5V supply with a shared ground.',circuits:[{src:'images/servo-wiring.png',caption:'Servo Wiring',cols:2,objectFit:'contain', height:'500px'}]},
  {emoji:'🔄',image:'images/dcmotor.png',name:'DC Motor + L298N',category:'Output · Motion',desc:'L298N driver controls speed and direction of DC motors. Foundation for robots.',tags:['L298N driver','analogWrite()','H-Bridge'],tagTeal:'Motor',level:3,badge:'Robot',badgeClass:'',color:'#1a1200',descFull:'DC motors spin freely in both directions and at variable speed. The L298N motor driver module uses an H-Bridge circuit to reverse current direction. ENA/ENB pins accept PWM for speed control.',uses:['Wheeled robot chassis','Conveyor belt systems','Electric fan speed control','Automated sliding doors'],pinout:[{pin:'ENA',arduino:'PWM Pin (e.g. 5)',notes:'Speed control Motor A',type:'teal'},{pin:'IN1',arduino:'Digital Pin (e.g. 6)',notes:'Direction control',type:'teal'},{pin:'IN2',arduino:'Digital Pin (e.g. 7)',notes:'Direction control',type:'teal'},{pin:'VCC (+12V)',arduino:'External power 6–12V',notes:'Motor power supply',type:'orange'},{pin:'GND',arduino:'GND (shared)',notes:'Common ground',type:''}],code:`<span class="kw">const</span> <span class="st">int</span> ENA=<span class="nm">5</span>,IN1=<span class="nm">6</span>,IN2=<span class="nm">7</span>;\n<span class="kw">void</span> <span class="fn">forward</span>(<span class="st">int</span> spd) {\n  <span class="fn">analogWrite</span>(ENA,spd);\n  <span class="fn">digitalWrite</span>(IN1,HIGH); <span class="fn">digitalWrite</span>(IN2,LOW);\n}\n<span class="kw">void</span> <span class="fn">loop</span>() { <span class="fn">forward</span>(<span class="nm">200</span>); <span class="fn">delay</span>(<span class="nm">2000</span>); }`,tip:'Always use a separate power supply for motors — they draw too much current for Arduino\'s 5V pin. Share only the GND.',circuits:[{src:'images/l298n.webp',caption:'L298N Motor Driver',objectFit:'contain', height:'400px'},{src:'images/l298n-wiring.png',caption:'L298N Motor Driver Pin Out',objectFit:'fill', height:'400px'},{src:'images/l298n-with- dc.jpg',caption:'L298N Motor Driver with DC motor Wiring',cols:2,objectFit:'fill', height:'700px'}]},
  {emoji:'⚙️',image:'images/stepper.svg',name:'Stepper Motor',category:'Output · Motion',desc:'Moves in precise steps instead of free-spinning. Used in CNC and robot arms.',tags:['Stepper lib','ULN2003','Precise steps'],tagTeal:'Motor',level:3,badge:'Hot',badgeClass:'hot',color:'#1a1000',descFull:'A stepper motor rotates in discrete steps (e.g. 2048 steps per full revolution for the 28BYJ-48). Unlike servo motors, steppers can rotate continuously in both directions and be positioned precisely.',uses:['CNC machine axes','3D printer movement','Robot arm precise joints','Camera slider'],pinout:[{pin:'IN1',arduino:'Pin 8',notes:'Step signal',type:'teal'},{pin:'IN2',arduino:'Pin 9',notes:'Step signal',type:'teal'},{pin:'IN3',arduino:'Pin 10',notes:'Step signal',type:'teal'},{pin:'IN4',arduino:'Pin 11',notes:'Step signal',type:'teal'},{pin:'5V–12V',arduino:'External power',notes:'Motor power',type:'orange'}],code:`<span class="kw">#include</span> <span class="st">&lt;Stepper.h&gt;</span>\nStepper motor(<span class="nm">2048</span>,<span class="nm">8</span>,<span class="nm">10</span>,<span class="nm">9</span>,<span class="nm">11</span>);\n<span class="kw">void</span> <span class="fn">setup</span>() { motor.<span class="fn">setSpeed</span>(<span class="nm">10</span>); }\n<span class="kw">void</span> <span class="fn">loop</span>() {\n  motor.<span class="fn">step</span>(<span class="nm">2048</span>);  <span class="fn">delay</span>(<span class="nm">500</span>); <span class="cm">// 1 full revolution</span>\n  motor.<span class="fn">step</span>(-<span class="nm">2048</span>); <span class="fn">delay</span>(<span class="nm">500</span>); <span class="cm">// reverse</span>\n}`,tip:'Use external power for the stepper — the ULN2003 driver draws too much for the Arduino 5V pin. Share GND with Arduino.',circuits:[{src:'images/stepper-wiring.webp',caption:'ULN2003 Stepper Wiring',cols:2,objectFit:'contain', height:'500px'}]},
  {emoji:'⚡',image:'images/relay.webp',name:'Relay Module',category:'Output · Power',desc:'Switch high-voltage devices with a 5V signal. Control lights, fans, motors.',tags:['HIGH/LOW signal','AC control','5V coil'],tagTeal:'Power',level:3,badge:'',badgeClass:'',color:'#1a1000',descFull:'A relay is an electrically operated switch that lets a low-voltage Arduino pin control high-voltage AC/DC loads (up to 250V AC / 30V DC). Most modules are active LOW.',uses:['Controlling mains-powered lights','Automated power strips','Motor on/off switching','AC appliance control'],pinout:[{pin:'VCC',arduino:'5V',notes:'Coil power',type:'orange'},{pin:'GND',arduino:'GND',notes:'Ground',type:''},{pin:'IN',arduino:'Digital Pin (e.g. 7)',notes:'LOW = relay ON (active low)',type:'teal'},{pin:'COM',arduino:'—',notes:'Common terminal (load)',type:''},{pin:'NO',arduino:'—',notes:'Normally Open — closes on trigger',type:''}],code:`<span class="kw">const</span> <span class="st">int</span> relayPin=<span class="nm">7</span>;\n<span class="kw">void</span> <span class="fn">setup</span>() { <span class="fn">pinMode</span>(relayPin,OUTPUT); <span class="fn">digitalWrite</span>(relayPin,HIGH); <span class="cm">// OFF</span> }\n<span class="kw">void</span> <span class="fn">loop</span>() {\n  <span class="fn">digitalWrite</span>(relayPin,LOW);  <span class="fn">delay</span>(<span class="nm">3000</span>); <span class="cm">// ON</span>\n  <span class="fn">digitalWrite</span>(relayPin,HIGH); <span class="fn">delay</span>(<span class="nm">3000</span>); <span class="cm">// OFF</span>\n}`,tip:'⚠️ NEVER touch the AC side while connected to mains power. Always test with low-voltage DC first.',circuits:[{src:'images/relay-wiring.png',caption:'Relay Module Wiring',cols:2,objectFit:'contain', height:'500px'}]},
  {emoji:'📶',image:'images/HC05.png',name:'Bluetooth HC-05',category:'Module · Wireless',desc:'Add wireless Bluetooth 2.0. Control Arduino from your smartphone via serial.',tags:['Serial comm','AT commands','Android/iOS'],tagTeal:'Wireless',level:3,badge:'',badgeClass:'',color:'#00001a',descFull:'The HC-05 is a Bluetooth 2.0 SPP module that creates a wireless serial link between your Arduino and any Bluetooth-capable device. Use AT commands to configure baud rate, name, and PIN code.',uses:['Smartphone-controlled robots','Wireless sensor data logging','Bluetooth keyboard/joystick input','Remote monitoring via phone app'],pinout:[{pin:'VCC',arduino:'5V',notes:'Module power',type:'orange'},{pin:'GND',arduino:'GND',notes:'Ground',type:''},{pin:'TXD',arduino:'RX pin (or SoftwareSerial)',notes:'Module → Arduino',type:'teal'},{pin:'RXD',arduino:'TX pin (via voltage divider!)',notes:'Arduino → Module (3.3V logic!)',type:'teal'}],code:`<span class="kw">#include</span> <span class="st">&lt;SoftwareSerial.h&gt;</span>\nSoftwareSerial <span class="fn">BT</span>(<span class="nm">10</span>,<span class="nm">11</span>);\n<span class="kw">void</span> <span class="fn">setup</span>() { Serial.<span class="fn">begin</span>(<span class="nm">9600</span>); BT.<span class="fn">begin</span>(<span class="nm">9600</span>); }\n<span class="kw">void</span> <span class="fn">loop</span>() {\n  <span class="kw">if</span>(BT.<span class="fn">available</span>()) {\n    <span class="st">char</span> c=BT.<span class="fn">read</span>(); Serial.<span class="fn">println</span>(c);\n  }\n}`,tip:'The HC-05 RXD pin is NOT 5V tolerant — use a voltage divider (1kΩ + 2kΩ) on the Arduino TX line.',circuits:[{src:'images/hc-05.jpg',caption:'HC-05 Bluetooth Module',objectFit:'fill', height:'400px',cols:2},{src:'images/hc05-wiring.webp',caption:'HC-05 Wiring with Voltage Divider',cols:2,objectFit:'contain', height:'500px'}]},
  {emoji:'🎮',image:null,name:'Joystick',category:'Input · Control',desc:'Dual-axis analog joystick with button. Great for robot controllers and games.',tags:['analogRead()','X/Y axis','Button press'],tagTeal:'Input',level:2,badge:'',badgeClass:'',color:'#12001a',descFull:'The joystick module contains two 10kΩ potentiometers (one for X, one for Y) and a push button (SW) triggered by pressing the stick down. At rest, both axes read ~512 (center).',uses:['Remote control for wheeled robots','Camera pan/tilt control','Game controller input','Menu navigation on OLED displays'],pinout:[{pin:'GND',arduino:'GND',notes:'Ground',type:''},{pin:'+5V',arduino:'5V',notes:'Power',type:'orange'},{pin:'VRx',arduino:'A0',notes:'X axis (0–1023)',type:'teal'},{pin:'VRy',arduino:'A1',notes:'Y axis (0–1023)',type:'teal'},{pin:'SW',arduino:'Digital (INPUT_PULLUP)',notes:'LOW when pressed',type:'teal'}],code:`<span class="kw">const</span> <span class="st">int</span> xPin=A0,yPin=A1,swPin=<span class="nm">2</span>;\n<span class="kw">void</span> <span class="fn">setup</span>() { Serial.<span class="fn">begin</span>(<span class="nm">9600</span>); <span class="fn">pinMode</span>(swPin,INPUT_PULLUP); }\n<span class="kw">void</span> <span class="fn">loop</span>() {\n  Serial.<span class="fn">print</span>(<span class="st">"X:"</span>); Serial.<span class="fn">print</span>(<span class="fn">analogRead</span>(xPin));\n  Serial.<span class="fn">print</span>(<span class="st">" Y:"</span>); Serial.<span class="fn">println</span>(<span class="fn">analogRead</span>(yPin));\n  <span class="fn">delay</span>(<span class="nm">200</span>);\n}`,tip:'Use map(analogRead(A0), 0, 1023, -100, 100) to get a centered −100 to +100 range for robot speed control.',circuits:[{src:'images/joystick.png',caption:'Joystick', objectFit:'contain'},{src:'images/joystick-wiring.png',caption:'Joystick Wiring',cols:2, objectFit:'contain', height:'500px'}]},
  {emoji:'🎛️',image:null,name:'Rotary Encoder',category:'Input · Control',desc:'Detects rotation direction and step count — turns forever, unlike a potentiometer.',tags:['CLK/DT pins','Digital read','Push switch'],tagTeal:'Input',level:2,badge:'',badgeClass:'',color:'#001a1a',descFull:'A rotary encoder outputs two square-wave signals (CLK and DT) that are slightly out of phase. By reading which one changes first, Arduino can tell not just that the knob turned, but which direction. Most modules also include a push button (SW) triggered by pressing the shaft down. Unlike a potentiometer, it has no fixed end stops and no absolute position — it only reports relative movement.',uses:['Menu navigation (scroll up/down)','Volume or brightness control with click-to-select','Precise manual jog control for CNC/robot arms','Digital clock time-setting knobs'],pinout:[{pin:'CLK',arduino:'Digital Pin (e.g. 2)',notes:'Rotation signal A',type:'teal'},{pin:'DT',arduino:'Digital Pin (e.g. 3)',notes:'Rotation signal B',type:'teal'},{pin:'SW',arduino:'Digital Pin (INPUT_PULLUP)',notes:'LOW when pressed',type:'teal'},{pin:'VCC',arduino:'5V',notes:'Power',type:'orange'},{pin:'GND',arduino:'GND',notes:'Ground',type:''}],code:`<span class="kw">const</span> <span class="st">int</span> clkPin=<span class="nm">2</span>, dtPin=<span class="nm">3</span>;\n<span class="st">int</span> lastClk, counter=<span class="nm">0</span>;\n\n<span class="kw">void</span> <span class="fn">setup</span>() {\n  <span class="fn">pinMode</span>(clkPin,INPUT); <span class="fn">pinMode</span>(dtPin,INPUT);\n  lastClk = <span class="fn">digitalRead</span>(clkPin);\n  Serial.<span class="fn">begin</span>(<span class="nm">9600</span>);\n}\n<span class="kw">void</span> <span class="fn">loop</span>() {\n  <span class="st">int</span> clk = <span class="fn">digitalRead</span>(clkPin);\n  <span class="kw">if</span> (clk != lastClk) {\n    <span class="kw">if</span> (<span class="fn">digitalRead</span>(dtPin) != clk) counter++; <span class="cm">// clockwise</span>\n    <span class="kw">else</span> counter--;                          <span class="cm">// counter-clockwise</span>\n    Serial.<span class="fn">println</span>(counter);\n  }\n  lastClk = clk;\n}`,tip:'A potentiometer reports an absolute position (0–1023); an encoder only reports relative steps and direction, so you keep a running counter in code. Debounce the CLK reading if you see the counter jump erratically.'},
  {emoji:'🔡',image:null,name:'4×4 Keypad',category:'Input · Digital',desc:'16-button matrix keypad read by scanning rows and columns with the Keypad library.',tags:['Keypad.h','Row/Col scan','4×4 grid'],tagTeal:'Input',level:2,badge:'',badgeClass:'',color:'#1a1a00',descFull:'A membrane keypad wires its buttons into a 4×4 grid so that 16 keys only need 8 Arduino pins (4 rows + 4 columns) instead of 16. The Keypad library scans the rows and columns for you and returns the character of whichever key is currently pressed.',uses:['PIN code entry for door locks','Calculator or data-entry projects','Menu selection alongside an LCD/OLED','Simple game controllers'],pinout:[{pin:'R1–R4',arduino:'Digital Pins (e.g. 9,8,7,6)',notes:'Row lines',type:'teal'},{pin:'C1–C4',arduino:'Digital Pins (e.g. 5,4,3,2)',notes:'Column lines',type:'teal'}],code:`<span class="kw">#include</span> <span class="st">&lt;Keypad.h&gt;</span>\n\n<span class="kw">const</span> <span class="dt">byte</span> ROWS=<span class="nm">4</span>, COLS=<span class="nm">4</span>;\n<span class="dt">char</span> keys[ROWS][COLS] = {\n  {<span class="st">'1'</span>,<span class="st">'2'</span>,<span class="st">'3'</span>,<span class="st">'A'</span>},\n  {<span class="st">'4'</span>,<span class="st">'5'</span>,<span class="st">'6'</span>,<span class="st">'B'</span>},\n  {<span class="st">'7'</span>,<span class="st">'8'</span>,<span class="st">'9'</span>,<span class="st">'C'</span>},\n  {<span class="st">'*'</span>,<span class="st">'0'</span>,<span class="st">'#'</span>,<span class="st">'D'</span>}\n};\n<span class="dt">byte</span> rowPins[ROWS] = {<span class="nm">9</span>,<span class="nm">8</span>,<span class="nm">7</span>,<span class="nm">6</span>};\n<span class="dt">byte</span> colPins[COLS] = {<span class="nm">5</span>,<span class="nm">4</span>,<span class="nm">3</span>,<span class="nm">2</span>};\nKeypad keypad = <span class="fn">Keypad</span>(<span class="fn">makeKeymap</span>(keys), rowPins, colPins, ROWS, COLS);\n\n<span class="kw">void</span> <span class="fn">setup</span>() { Serial.<span class="fn">begin</span>(<span class="nm">9600</span>); }\n<span class="kw">void</span> <span class="fn">loop</span>() {\n  <span class="dt">char</span> key = keypad.<span class="fn">getKey</span>();\n  <span class="kw">if</span> (key) Serial.<span class="fn">println</span>(key); <span class="cm">// prints the pressed key</span>\n}`,tip:'Double-check the row/column pin order — swapping rows for columns is the most common wiring mistake and makes every key read wrong. If keys are jumbled, try reversing rowPins and colPins.'},
  {emoji:'🔢',image:'images/7seg.png',name:'7-Segment Display',category:'Output · Display',desc:'Show digits 0–9 on seven LED segments. Perfect for counters and clocks.',tags:['BCD decoder','Segment pins','Multiplexing'],tagTeal:'Display',level:2,badge:'',badgeClass:'',color:'#0a1200',descFull:'A 7-segment display has 7 LED segments (a–g) and a decimal point. Each segment is addressed by a separate pin. Common cathode types connect the common pin to GND. For multiple digits, multiplexing rapidly switches between them.',uses:['Digital score displays','Countdown timers','Temperature readouts','Clock displays'],pinout:[{pin:'a–g, dp',arduino:'Digital Pins 2–9',notes:'Each segment via 220Ω',type:'teal'},{pin:'COM (common cathode)',arduino:'GND',notes:'Or 5V for common anode',type:''}],code:`<span class="st">int</span> segs[]={<span class="nm">2</span>,<span class="nm">3</span>,<span class="nm">4</span>,<span class="nm">5</span>,<span class="nm">6</span>,<span class="nm">7</span>,<span class="nm">8</span>};\n<span class="st">int</span> nums[<span class="nm">3</span>][<span class="nm">7</span>]={{<span class="nm">1</span>,<span class="nm">1</span>,<span class="nm">1</span>,<span class="nm">1</span>,<span class="nm">1</span>,<span class="nm">1</span>,<span class="nm">0</span>},{<span class="nm">0</span>,<span class="nm">1</span>,<span class="nm">1</span>,<span class="nm">0</span>,<span class="nm">0</span>,<span class="nm">0</span>,<span class="nm">0</span>},{<span class="nm">1</span>,<span class="nm">1</span>,<span class="nm">0</span>,<span class="nm">1</span>,<span class="nm">1</span>,<span class="nm">0</span>,<span class="nm">1</span>}};\n<span class="kw">void</span> <span class="fn">setup</span>() { <span class="kw">for</span>(<span class="st">int</span> i=<span class="nm">0</span>;i&lt;<span class="nm">7</span>;i++) <span class="fn">pinMode</span>(segs[i],OUTPUT); }\n<span class="kw">void</span> <span class="fn">loop</span>() { <span class="kw">for</span>(<span class="st">int</span> n=<span class="nm">0</span>;n&lt;<span class="nm">3</span>;n++){<span class="kw">for</span>(<span class="st">int</span> i=<span class="nm">0</span>;i&lt;<span class="nm">7</span>;i++) <span class="fn">digitalWrite</span>(segs[i],nums[n][i]);<span class="fn">delay</span>(<span class="nm">800</span>);} }`,tip:'For multiple 7-segment digits, use a MAX7219 driver IC — it controls up to 8 digits with just 3 Arduino pins via SPI.',circuits:[{src:'images/7seg-wiring.png',caption:'7-Segment Wiring',cols:2, objectFit:'contain', height:'500px'}]},
  {emoji:'🕐',image:null,name:'TM1637 4-Digit Display',category:'Output · Display',desc:'4-digit 7-segment module driven by just 2 pins — the easy way to show numbers and clocks.',tags:['TM1637 lib','2-wire','4-digit'],tagTeal:'Display',level:1,badge:'',badgeClass:'',color:'#0a0a1a',descFull:'The TM1637 module packs four 7-segment digits (plus a center colon for clocks) behind its own driver chip, so instead of wiring 7+ pins per digit like a raw 7-segment display, you only need two pins: CLK and DIO. The TM1637 library handles all the segment logic and multiplexing for you.',uses:['Digital clocks and countdown timers','Scoreboards and counters','Simple numeric readouts for sensor values','Stopwatch and lap timers'],pinout:[{pin:'CLK',arduino:'Digital Pin (e.g. 2)',notes:'Clock line',type:'teal'},{pin:'DIO',arduino:'Digital Pin (e.g. 3)',notes:'Data line',type:'teal'},{pin:'VCC',arduino:'5V',notes:'Power',type:'orange'},{pin:'GND',arduino:'GND',notes:'Ground',type:''}],code:`<span class="kw">#include</span> <span class="st">&lt;TM1637Display.h&gt;</span>\n\n<span class="kw">const</span> <span class="dt">int</span> CLK=<span class="nm">2</span>, DIO=<span class="nm">3</span>;\nTM1637Display display(CLK, DIO);\n\n<span class="kw">void</span> <span class="fn">setup</span>() {\n  display.<span class="fn">setBrightness</span>(<span class="nm">7</span>); <span class="cm">// 0–7</span>\n}\n<span class="kw">void</span> <span class="fn">loop</span>() {\n  display.<span class="fn">showNumberDec</span>(<span class="nm">1234</span>); <span class="cm">// shows "1234"</span>\n  <span class="fn">delay</span>(<span class="nm">1000</span>);\n  display.<span class="fn">showNumberDecEx</span>(<span class="nm">930</span>, <span class="nm">0x40</span>, <span class="kw">true</span>); <span class="cm">// "09:30" with colon</span>\n  <span class="fn">delay</span>(<span class="nm">1000</span>);\n}`,tip:'For multi-digit numbers, a raw 7-segment display needs multiplexing code across many pins — TM1637 does that internally, so it\'s the friendlier choice whenever you just need to display numbers rather than custom pixel patterns.'},
  {emoji:'🔲',image:'images/matrix8x8.png',name:'8×8 LED Matrix',category:'Output · LED Matrix',desc:'Display scrolling text, animations and icons on an 8×8 LED grid.',tags:['MAX7219','SPI','LED'],tagTeal:'Display',level:2,badge:'',badgeClass:'',color:'#0a0a0a',descFull:'8×8 LED matrix modules driven by the MAX7219 display 64 individually controllable LEDs. Controlled via SPI with just 3 Arduino pins. Use the LedControl or MD_MAX72XX library.',uses:['Scrolling news ticker','Game display (Snake, Tetris)','Digital clock icons','Robot facial expressions'],pinout:[{pin:'VCC',arduino:'5V',notes:'Power',type:'orange'},{pin:'GND',arduino:'GND',notes:'Ground',type:''},{pin:'DIN',arduino:'Pin 11 (MOSI)',notes:'SPI data',type:'teal'},{pin:'CLK',arduino:'Pin 13 (SCK)',notes:'SPI clock',type:'teal'},{pin:'CS',arduino:'Pin 10',notes:'SPI chip select',type:'teal'}],code:`<span class="kw">#include</span> <span class="st">&lt;LedControl.h&gt;</span>\nLedControl lc=<span class="fn">LedControl</span>(<span class="nm">11</span>,<span class="nm">13</span>,<span class="nm">10</span>,<span class="nm">1</span>);\n\n<span class="cm">// each byte is one row of the grid — 1 = LED on, 0 = LED off</span>\n<span class="dt">byte</span> heart[<span class="nm">8</span>] = {\n  B00000000,\n  B01100110,\n  B11111111,\n  B11111111,\n  B11111111,\n  B01111110,\n  B00111100,\n  B00011000\n};\n\n<span class="kw">void</span> <span class="fn">setup</span>() {\n  lc.<span class="fn">shutdown</span>(<span class="nm">0</span>,<span class="kw">false</span>); lc.<span class="fn">setIntensity</span>(<span class="nm">0</span>,<span class="nm">8</span>); lc.<span class="fn">clearDisplay</span>(<span class="nm">0</span>);\n}\n<span class="kw">void</span> <span class="fn">loop</span>() {\n  <span class="kw">for</span> (<span class="dt">int</span> row = <span class="nm">0</span>; row &lt; <span class="nm">8</span>; row++) {\n    lc.<span class="fn">setRow</span>(<span class="nm">0</span>, row, heart[row]); <span class="cm">// draw one whole row at once</span>\n  }\n}`,tip:'setLed() only lights one pixel at a time. To draw shapes, define a byte[8] array where each byte is a row (1 = on, 0 = off), then push it row-by-row with setRow(). Use MD_MAX72XX with MD_Parola for easy scrolling text and built-in animations.',circuits:[{src:'images/matrix-wiring.jpg',caption:'MAX7219 Matrix Wiring', objectFit:'contain', height:'500px', cols:2}]},
  {emoji:'🖥️',image:'images/lcd.png',name:'LCD Display',category:'Output · Display',desc:'16×2 character LCD. Display sensor data, messages and menus in real time.',tags:['LiquidCrystal','16×2 chars','I2C backpack'],tagTeal:'Display',level:2,badge:'New',badgeClass:'',color:'#001208',descFull:'The 16×2 LCD can show 16 characters across 2 rows. Using it with an I2C backpack module reduces wiring from 6+ pins to just 2 (SDA + SCL). Install the "LiquidCrystal I2C" library for the I2C version.',uses:['Real-time sensor readings','Menu systems for user interaction','Countdown timers and clocks','Debug output without Serial Monitor'],pinout:[{pin:'VCC (I2C module)',arduino:'5V',notes:'Power',type:'orange'},{pin:'GND (I2C module)',arduino:'GND',notes:'Ground',type:''},{pin:'SDA (I2C module)',arduino:'A4 (SDA)',notes:'I2C data',type:'teal'},{pin:'SCL (I2C module)',arduino:'A5 (SCL)',notes:'I2C clock',type:'teal'}],code:`<span class="kw">#include</span> <span class="st">&lt;Wire.h&gt;</span>\n<span class="kw">#include</span> <span class="st">&lt;LiquidCrystal_I2C.h&gt;</span>\nLiquidCrystal_I2C <span class="fn">lcd</span>(<span class="nm">0x27</span>,<span class="nm">16</span>,<span class="nm">2</span>);\n\n<span class="cm">// a 5×8 pixel shape stored as 8 bytes — 1 = pixel on</span>\n<span class="dt">byte</span> heart[<span class="nm">8</span>] = {\n  B00000,\n  B01010,\n  B11111,\n  B11111,\n  B01110,\n  B00100,\n  B00000,\n  B00000\n};\n\n<span class="kw">void</span> <span class="fn">setup</span>() {\n  lcd.<span class="fn">init</span>(); lcd.<span class="fn">backlight</span>();\n  lcd.<span class="fn">createChar</span>(<span class="nm">0</span>, heart); <span class="cm">// store the shape in slot 0</span>\n  lcd.<span class="fn">setCursor</span>(<span class="nm">0</span>,<span class="nm">0</span>);\n  lcd.<span class="fn">write</span>(<span class="fn">byte</span>(<span class="nm">0</span>)); <span class="cm">// draw the custom shape</span>\n  lcd.<span class="fn">print</sp /* ════════ STATE ════════ */
let current=0, filtered=[...components], detailOpen=false;

/* ════════ THREE.JS BACKGROUND ════════ */
(function(){
  const canvas=document.getElementById('heroCanvas');
  const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,100);
  camera.position.set(0,0,14);

  scene.add(new THREE.AmbientLight(0xffffff,0.3));
  const l1=new THREE.PointLight(0x00979d,2.5,30); l1.position.set(10,6,5); scene.add(l1);
  const l2=new THREE.PointLight(0xe8500a,1.5,25); l2.position.set(-10,-5,4); scene.add(l2);

  const comps=[];
  const positions=[];
  for(let i=0;i<24;i++){
    const geo=new THREE.OctahedronGeometry(0.15+Math.random()*0.2,0);
    const col=[0x00979d,0xe8500a,0xffdd00,0x66bb6a,0x42a5f5,0xab47bc][Math.floor(Math.random()*6)];
    const mat=new THREE.MeshPhongMaterial({color:col,emissive:col,emissiveIntensity:.5,shininess:80});
    const mesh=new THREE.Mesh(geo,mat);
    const px=(Math.random()-.5)*20, py=(Math.random()-.5)*12, pz=(Math.random()-.5)*4-3;
    mesh.position.set(px,py,pz);
    scene.add(mesh);
    positions.push([px,py,pz]);
    comps.push({mesh,speed:.2+Math.random()*.5,off:Math.random()*Math.PI*2});
  }

  const lineMat=new THREE.LineBasicMaterial({color:0x00979d,opacity:.08,transparent:true});
  for(let i=0;i<8;i++){
    const y=-5+i*1.5;
    const pts=[new THREE.Vector3(-12,y,-4),new THREE.Vector3(12,y,-4)];
    scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),lineMat));
  }
  for(let i=0;i<6;i++){
    const x=-8+i*3;
    const pts=[new THREE.Vector3(x,-6,-4),new THREE.Vector3(x,6,-4)];
    scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),lineMat));
  }

  let mx=0,my=0;
  document.addEventListener('mousemove',e=>{mx=(e.clientX/innerWidth-.5)*2;my=-(e.clientY/innerHeight-.5)*2;});

  function resize(){
    const w=canvas.parentElement.clientWidth, h=canvas.parentElement.clientHeight;
    renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix();
  }

  let t=0;
  function animate(){
    requestAnimationFrame(animate); t+=.01;
    comps.forEach((c,i)=>{
      c.mesh.position.y=positions[i][1]+Math.sin(t*c.speed+c.off)*.4;
      c.mesh.rotation.x+=.006; c.mesh.rotation.y+=.009;
    });
    l1.position.x=6+Math.sin(t*.3)*4;
    camera.position.x+=(mx*.8-camera.position.x)*.03;
    camera.position.y+=(my*.5-camera.position.y)*.03;
    camera.lookAt(0,0,0);
    renderer.render(scene,camera);
  }
  resize(); addEventListener('resize',resize); animate();
})();

/* ════════ RENDER CARDS ════════ */
function renderCards(){
  const track=document.getElementById('cardsTrack');
  track.innerHTML=filtered.map((c,i)=>{
    const visual=c.image
      ?`<div class="card-visual"><img src="${c.image}" alt="${c.name}" loading="lazy"></div>`
      :`<div class="card-visual"><span class="card-emoji">${c.emoji}</span></div>`;
    return `<div class="comp-card ${i===current?'active':''}" onclick="jumpTo(${i})">
      ${c.badge?`<div class="card-badge ${c.badgeClass}">${c.badge}</div>`:''}
      ${visual}
      <div class="card-overlay"></div>
      <div class="card-info">
        <div class="card-category">${c.category}</div>
        <div class="card-name">${c.name}</div>
        <div class="card-dots">${[1,2,3].map(d=>`<div class="card-dot ${c.level>=d?'on':''}"></div>`).join('')}</div>
      </div>
    </div>`;
  }).join('');
  updateTrackPosition(false);
  document.getElementById('totalCount').textContent='/ '+filtered.length;
}

function updateTrackPosition(animate=true){
  const track=document.getElementById('cardsTrack');
  const CARD_W=204, OFFSET_X=16;
  const offset=current*CARD_W-OFFSET_X;
  if(!animate) track.style.transition='none';
  track.style.transform=`translateX(-${Math.max(0,offset)}px)`;
  if(!animate){void track.offsetWidth; track.style.transition='';}
  document.querySelectorAll('.comp-card').forEach((el,i)=>el.classList.toggle('active',i===current));
}

function updatePanel(idx){
  const c=filtered[idx]; if(!c)return;
  document.getElementById('bgLayer').style.backgroundColor=c.color;
  document.getElementById('bgEmoji').textContent=c.image?'':c.emoji;
  ['compCategory','compName','compDesc'].forEach(id=>{
    const el=document.getElementById(id);
    el.classList.remove('panel-swap'); void el.offsetWidth; el.classList.add('panel-swap');
  });
  setTimeout(()=>{
    document.getElementById('compCategory').textContent=c.category;
    document.getElementById('compName').textContent=c.name;
    document.getElementById('compDesc').textContent=c.desc;
    document.getElementById('compTags').innerHTML=`<span class="comp-tag teal">${c.tagTeal}</span>`+c.tags.map(t=>`<span class="comp-tag">${t}</span>`).join('');
    document.querySelectorAll('#diffDots .diff-dot').forEach((d,i)=>d.classList.toggle('on',i<c.level));
    const num=String(idx+1).padStart(2,'0');
    document.getElementById('compCounter').textContent=num;
    document.getElementById('counterInline').textContent=num;
    document.getElementById('progressFill').style.width=((idx+1)/filtered.length*100)+'%';
  },80);
}

function navigate(dir){
  current=(current+dir+filtered.length)%filtered.length;
  updateTrackPosition(true); updatePanel(current);
}
function jumpTo(idx){
  if(idx===current)return;
  current=idx; updateTrackPosition(true); updatePanel(current);
}

/* ════════ DETAIL PANEL ════════ */
function openDetail(){
  const c=filtered[current]; if(!c)return;
  document.getElementById('detailCrumb').textContent=`Components / ${c.name}`;
  renderDetail(c);
  document.getElementById('heroPanel').style.display='none';
  document.getElementById('detailPanel').style.display='flex';
  document.getElementById('detailPanel').style.flexDirection='column';
  document.getElementById('detailPanel').scrollTop=0;
  detailOpen=true;
}

function closeDetail(){
  document.getElementById('detailPanel').style.display='none';
  document.getElementById('heroPanel').style.display='';
  detailOpen=false;
}

function renderDetail(c){
  const idx=filtered.indexOf(c);
  const isLast=idx===filtered.length-1, isFirst=idx===0;
  const visual=c.image
    ?`<img src="${c.image}" alt="${c.name}" style="max-height:160px;object-fit:contain;">`
    :`<span style="font-size:120px;filter:drop-shadow(0 12px 30px rgba(0,0,0,0.5))">${c.emoji}</span>`;

  const pinRows=c.pinout.map(p=>`<tr><td>${p.pin}</td><td><span class="pin-badge ${p.type}">${p.arduino}</span></td><td>${p.notes}</td></tr>`).join('');
  const useRows=c.uses.map(u=>`<div class="use-row"><div class="use-dot"></div><span>${u}</span></div>`).join('');

  let circuitHtml='';
  if(c.circuits&&c.circuits.length>0){
    const imgs=c.circuits.map(ci=>{
      const h=ci.height||'220px',fit=ci.objectFit||'cover',span=ci.cols===2?'grid-column:1/-1;':'';
      return `<div class="circuit-img-wrap" style="${span}">
        <img src="${ci.src}" alt="${ci.caption}" loading="lazy" style="height:${h};object-fit:${fit};">
        <div class="circuit-caption">${ci.caption}</div>
      </div>`;
    }).join('');
    circuitHtml=`<div class="circuit-section"><div class="detail-section-title">Circuit Diagrams & Wiring Photos</div><div class="circuit-grid">${imgs}</div></div>`;
  }

  const bottomNav=`<div class="detail-bottom-nav">
    ${!isFirst?`<button class="btn-detail-prev" onclick="detailNav(-1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Previous</button>`:'<div></div>'}
    ${isLast
      ?`<button class="btn-detail-next is-last" onclick="closeDetail()">← Back to Components</button>`
      :`<button class="btn-detail-next" onclick="detailNav(1)">Next Component<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>`}
  </div>`;

  document.getElementById('detailContent').innerHTML=`
    <div style="grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:28px;padding:24px 0 16px;border-bottom:1px solid var(--border);">
      ${visual}
      <span class="detail-visual-badge">${c.tagTeal} · Level ${c.level}</span>
    </div>
    <div>
      <div class="detail-section-title">About This Component</div>
      <div class="detail-component-name">${c.name}</div>
      <span class="detail-category-tag">${c.category}</span>
      <div class="detail-desc-full">${c.descFull}</div>
      <div class="detail-uses-title">🔧 Where We Use It</div>
      <div style="margin-bottom:20px;">${useRows}</div>
      <div class="detail-section-title" style="margin-top:20px;">Pinout / Wiring</div>
      <table class="pinout-table"><thead><tr><th>Pin</th><th>Arduino</th><th>Notes</th></tr></thead><tbody>${pinRows}</tbody></table>
    </div>
    <div>
      <div class="detail-section-title">Sample Code</div>
      <div class="code-block">
        <div class="code-header"><span class="code-lang">Arduino C++</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
        <pre class="code-pre">${c.code}</pre>
      </div>
      <div class="tip-box"><div class="tip-icon">💡</div><div class="tip-text"><strong>Pro Tip:</strong> ${c.tip}</div></div>
    </div>
    ${circuitHtml}
    ${bottomNav}
  `;
}

function detailNav(dir){
  current=(current+dir+filtered.length)%filtered.length;
  updateTrackPosition(true); updatePanel(current);
  document.getElementById('detailCrumb').textContent=`Components / ${filtered[current].name}`;
  renderDetail(filtered[current]);
  document.getElementById('detailPanel').scrollTop=0;
}

function copyCode(btn){
  const pre=btn.closest('.code-block').querySelector('pre');
  navigator.clipboard.writeText(pre.innerText).then(()=>{btn.textContent='✓ Copied!';setTimeout(()=>{btn.textContent='Copy';},1800);});
}

/* ════════ FILTER ════════ */
function filterComps(cat,pill){
  document.querySelectorAll('.filter-pill').forEach(p=>p.classList.remove('active'));
  pill.classList.add('active');
  filtered=cat==='all'?[...components]:components.filter(c=>c.category.toLowerCase().includes(cat)||c.tags.some(t=>t.toLowerCase().includes(cat)));
  current=0; renderCards(); updatePanel(0);
}

/* ════════ SEARCH ════════ */
function handleSearch(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  filtered=q?components.filter(c=>c.name.toLowerCase().includes(q)||c.category.toLowerCase().includes(q)||c.tags.some(t=>t.toLowerCase().includes(q))):[...components];
  current=0; renderCards(); updatePanel(0);
}

/* ════════ KEYBOARD + SCROLL ════════ */
document.addEventListener('keydown',e=>{
  if(detailOpen){if(e.key==='Escape')closeDetail();return;}
  if(e.key==='ArrowRight')navigate(1);
  if(e.key==='ArrowLeft')navigate(-1);
  if(e.key==='Enter')openDetail();
});

let scrollLock=false;
document.getElementById('heroPanel').addEventListener('wheel',e=>{
  if(detailOpen)return; e.preventDefault();
  if(scrollLock)return;
  navigate(e.deltaY>0||e.deltaX>0?1:-1);
  scrollLock=true; setTimeout(()=>scrollLock=false,420);
},{passive:false});

let touchStartX=0;
document.getElementById('heroPanel').addEventListener('touchstart',e=>{touchStartX=e.touches[0].clientX;},{passive:true});
document.getElementById('heroPanel').addEventListener('touchend',e=>{
  if(detailOpen)return;
  const dx=e.changedTouches[0].clientX-touchStartX;
  if(Math.abs(dx)<40)return;
  navigate(dx<0?1:-1);
},{passive:true});

function navSearch(q) {
  q = q.toLowerCase().trim();
  if (!q) return;
  const routes = [
    { keywords: ['led','resistor','buzzer','sensor','servo','motor','lcd','oled','rfid','bluetooth','relay','ultrasonic','component','mpu','color','lm35','nano','mega'], page: 'components.html' },
    { keywords: ['mblock','block','scratch','drag','beginner'], page: 'mblock.html' },
    { keywords: ['c++','cpp','code','variable','loop','function','serial'], page: 'cpp.html' },
    { keywords: ['project','light','piano','switch','reaction','blink'], page: 'projects.html' },
  ];
  for (const route of routes) {
    if (route.keywords.some(k => q.includes(k))) {
      window.location.href = route.page + '?search=' + encodeURIComponent(q);
      return;
    }
  }
}

document.addEventListener('click',()=>document.getElementById('accountDropdown')?.classList.remove('open'));

const obs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('visible');}),{threshold:.08});
document.querySelectorAll('.reveal').forEach(el=>obs.observe(el));

/* ════════ INIT ════════ */
renderCards(); updatePanel(0);
</script>

  document.getElementById('accountDropdown').classList.remove('open');
});

async function handleLogout(){
  if(!confirm('Log out?'))return;
  await auth.signOut();
  window.location.replace('index.html');
}
